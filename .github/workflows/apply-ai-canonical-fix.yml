name: Apply AI canonical candidate fix

on:
  push:
    branches:
      - fix/ai-canonical-candidate-window

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[ai-canonical-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-canonical-candidate-window
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/_shop.js')
          s = p.read_text()
          marker = """/**
           * 쿠팡 + ADPICK을 함께 조회해 결과를 돌려준다.
          """
          helper = """
          /**
           * AI 전용 공급원 결합 순서.
           *
           * 같은 상품 식별 점수라면 provider-local 순번을 교차시킨다:
           * C0, A0, C1, A1 ... . 따라서 한 공급원이 먼저 배열에 붙었다는 이유만으로
           * 다른 공급원의 정확한 동일상품이 MAX_CTX_ITEMS 밖으로 밀리지 않는다.
           */
          function orderAiSearchCandidates(keyword, coupangItems, adpickItems) {
            const c = Array.isArray(coupangItems) ? coupangItems : [];
            const a = Array.isArray(adpickItems) ? adpickItems : [];
            const merged = [...c, ...a];
            if (merged.length < 2) return merged;

            let identityMatchScore;
            try { ({ identityMatchScore } = require('./_search')); }
            catch (_) { return merged; }
            if (typeof identityMatchScore !== 'function') return merged;

            const bucket = (items, sourceOffset) => items
              .map((item, index) => ({
                item,
                index,
                score: Number(identityMatchScore(keyword, item && item.title)) || 0
              }))
              .sort((x, y) => y.score - x.score || x.index - y.index)
              .map((entry, rank) => Object.assign(entry, { tie: rank * 2 + sourceOffset }));

            return bucket(c, 0).concat(bucket(a, 1))
              .sort((x, y) => y.score - x.score || x.tie - y.tie)
              .map(x => x.item);
          }

          """
          if 'function orderAiSearchCandidates(' not in s:
              if marker not in s:
                  raise SystemExit('helper insert marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = """  const items = [...coupang.items, ...adpick.items];
            const errors = [coupang.error, adpick.error].filter(Boolean);
          """
          new = """  /*
             * AI 후보 창은 공급원 결합 순서에 끌려가면 안 된다.
             *
             * searchAll 의 기본 결합은 역사적으로 쿠팡 → ADPICK 순서다. /api/search 는
             * 뒤에서 관련도 정렬을 다시 하므로 문제가 없지만, AI 는 지연 상한 때문에
             * 처음 몇 건만 가격 이력·식별 검증에 넣는다. 그 상태에서 쿠팡 6건이 먼저
             * 오면 ADPICK 의 정확한 동일상품이 후보 창 밖으로 밀려 canonical 최저가를
             * 놓칠 수 있다.
             *
             * AI 호출에서만 검색 식별 점수로 먼저 세우고, 점수가 같은 경우 두 공급원을
             * 번갈아 놓는다. 결과를 버리거나 합치지 않으며, 일반 검색·cron 순서는
             * 그대로다. 낮은 관련도의 타 공급원이 높은 관련도보다 앞서는 일도 없다.
             */
            const aiSource = coupangOpts.source === 'ai' || adpickOpts.source === 'ai';
            const items = aiSource
              ? orderAiSearchCandidates(keyword, coupang.items, adpick.items)
              : [...coupang.items, ...adpick.items];
            const errors = [coupang.error, adpick.error].filter(Boolean);
          """
          if old not in s and 'const aiSource = coupangOpts.source' not in s:
              raise SystemExit('searchAll target not found')
          if old in s:
              s = s.replace(old, new, 1)

          oldexp = """  relevantItems, relevantRows, freshRows, matchesKeyword, keywordTokens, isRecordableSource,
            discountPct, searchPhraseFromTitle, MAX_DISPLAY_AGE_DAYS,
          """
          newexp = """  relevantItems, relevantRows, freshRows, matchesKeyword, keywordTokens, isRecordableSource,
            orderAiSearchCandidates,
            discountPct, searchPhraseFromTitle, MAX_DISPLAY_AGE_DAYS,
          """
          if oldexp in s:
              s = s.replace(oldexp, newexp, 1)
          elif 'orderAiSearchCandidates,' not in s:
              raise SystemExit('export target not found')
          p.write_text(s)

          p = Path('scripts/test-p2-resilience.js')
          s = p.read_text()
          needle = """  const realShop = require('../api/_shop');
          """
          addition = """  const realShop = require('../api/_shop');

            await check('AI 후보 창은 공급원 배열 순서 때문에 정확 동일상품을 놓치지 않는다', async () => {
              const q = '소니 WH-CH730N';
              const coupang = Array.from({ length: 6 }, (_, i) => ({
                mall: '쿠팡', productId: `c${i}`, title: `소니 WH-CH730N 노이즈 캔슬링 헤드폰 쿠팡 ${i}`
              }));
              const adpick = [
                { mall: 'ADPICK', productId: 'a0', title: '[해외] 소니 FX3 카메라 케이지' },
                { mall: 'ADPICK', productId: 'canonical', title: '소니 WH-CH730N 노이즈캔슬링 블루투스 헤드폰' },
                { mall: 'ADPICK', productId: 'a2', title: '소니 WH-CH730N 공식대리점 헤드폰' },
                { mall: 'ADPICK', productId: 'a3', title: '소니 WH-CH730N 무선 헤드폰' }
              ];
              const ordered = realShop.orderAiSearchCandidates(q, coupang, adpick);
              const first8 = ordered.slice(0, 8);
              assert.equal(first8.some(x => x.productId === 'canonical'), true);
              assert.ok(first8.findIndex(x => x.productId === 'canonical') < 4,
                '정확한 ADPICK 동일상품은 source-order 9번째가 아니라 앞 후보 창에 들어와야 한다');
              assert.equal(ordered[0].mall, '쿠팡');
              assert.equal(ordered[1].mall, 'ADPICK');
            });
          """
          if 'AI 후보 창은 공급원 배열 순서 때문에 정확 동일상품을 놓치지 않는다' not in s:
              if needle not in s:
                  raise SystemExit('test insert target not found')
              s = s.replace(needle, addition, 1)
          p.write_text(s)
          PY

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted regression
        run: |
          node scripts/test-p2-resilience.js
          node scripts/test-search.js
          node scripts/test-search-ranking-intent.js
          node scripts/test-canonical-consumer.js
          git diff --check

      - name: Commit fix to branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/_shop.js scripts/test-p2-resilience.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(ai): keep canonical candidates across suppliers [ai-canonical-applied]"
          git push origin HEAD:fix/ai-canonical-candidate-window
