name: Collector Regression

on:
  pull_request:
    paths:
      - 'scripts/collect-all-prices.js'
      - 'scripts/test-second-pass.js'
      - 'scripts/test-price-mall-collection.js'
      - 'scripts/test-collector-scale.js'
      - 'scripts/test-collector-coverage.js'
      - 'api/_blockreason.js'
      - 'api/_coupang.js'
      - 'api/_neonpg.js'
      - 'scripts/v3-canary-gate.js'
      - 'scripts/test-collector-hint-options.js'
      - 'scripts/test-coupang-rcode5xx.js'
      - 'scripts/test-collector-image-lazy.js'
      - 'scripts/_daycache.js'
      - 'scripts/collect-hotdeals.js'
      - 'scripts/test-daycache.js'
      - 'scripts/collect-volatile-prices.js'
      - 'scripts/_price-volatility.js'
      - 'scripts/test-price-volatility.js'
      - 'scripts/_volatile-report.js'
      - 'scripts/test-volatile-report.js'
      - '.github/workflows/volatile-prices.yml'
      - '.github/workflows/daily-prices.yml'
      - '.github/workflows/hotdeals.yml'
      - 'scripts/check-alerts.js'
      - 'supabase/2026-09-22-collector-target-keyset.sql'
      - '.github/workflows/collector-regression.yml'
  workflow_dispatch:

jobs:
  collector-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Second-pass and budget regression
        run: node scripts/test-second-pass.js
      - name: Mall collection/report regression
        run: node scripts/test-price-mall-collection.js
      # 2026-09-22 collector_target_products statement timeout 사고 회귀.
      # 100 / 1,000 / 10,000 / 60,000 규모에서 대상 조회·재개·중복 방지·
      # 상품별 최종 상태 합계를 고정한다. DB/외부 API 를 부르지 않는다.
      - name: Collector scale and durability regression
        run: node scripts/test-collector-scale.js
      # 2026-09-29 미시도 원인 회귀: 100개/호출 20회/5회 → 전부 시도, P0→P1→P2→P3 순서,
      # 일시 쿨다운 대기·거절 정지·예산 즉시 정지·체크포인트 이어받기·당일 캐시.
      - name: Collector coverage and priority regression
        run: node scripts/test-collector-coverage.js
      # 2026-10-21 Neon 전환 뒤 수집률 17.5% 원인 회귀: V3 게이트의 JSON 경로 select,
      # 쿠팡 hint 는 추적 옵션이 실린 검색어만, rCode 5xx 는 거절이 아니라 일시 장애(5분 · 래치 없음).
      - name: Neon adapter (V3 gate JSON-path select)
        run: node scripts/migration/test-neon-adapter.js
      - name: Cache-hint option check regression
        run: node scripts/test-collector-hint-options.js
      - name: Coupang rCode 5xx regression
        run: node scripts/test-coupang-rcode5xx.js
      # 2026-10-21 Neon Free 전송량: 대상 행에서 사진 열을 빼고 저장할 행만 사진을 읽는다.
      - name: Collector lazy image regression
        run: node scripts/test-collector-image-lazy.js
      # 2026-10-22 하루 캐시: 캐시 끔 = 캐시 생성 = 캐시 사용 결과, 실패 묶음은 캐시에 넣지 않는다.
      - name: Day cache (collector targets, hot-deal history) regression
        run: node scripts/test-daycache.js
      - name: Adaptive price volatility regression
        run: |
          node --check scripts/_price-volatility.js
          node --check scripts/collect-volatile-prices.js
          node scripts/test-price-volatility.js
          node --check scripts/_volatile-report.js
          node scripts/test-volatile-report.js
      - name: Migration safety (static only, no DB credentials)
        run: node scripts/verify-migrations.js
