name: Collector Regression

on:
  pull_request:
    paths:
      - 'scripts/collect-all-prices.js'
      - 'scripts/test-second-pass.js'
      - 'scripts/test-price-mall-collection.js'
      - 'scripts/test-collector-scale.js'
      - 'scripts/test-collector-coverage.js'
      - 'api/_blockreason.js'
      - 'supabase/2026-09-22-collector-target-keyset.sql'
      - '.github/workflows/collector-regression.yml'
  workflow_dispatch:

jobs:
  collector-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Second-pass and budget regression
        run: node scripts/test-second-pass.js
      - name: Mall collection/report regression
        run: node scripts/test-price-mall-collection.js
      # 2026-09-22 collector_target_products statement timeout 사고 회귀.
      # 100 / 1,000 / 10,000 / 60,000 규모에서 대상 조회·재개·중복 방지·
      # 상품별 최종 상태 합계를 고정한다. DB/외부 API 를 부르지 않는다.
      - name: Collector scale and durability regression
        run: node scripts/test-collector-scale.js
      # 2026-09-29 미시도 원인 회귀: 100개/호출 20회/5회 → 전부 시도, P0→P1→P2→P3 순서,
      # 일시 쿨다운 대기·거절 정지·예산 즉시 정지·체크포인트 이어받기·당일 캐시.
      - name: Collector coverage and priority regression
        run: node scripts/test-collector-coverage.js
      - name: Migration safety (static only, no DB credentials)
        run: node scripts/verify-migrations.js
