name: Collector Regression

on:
  pull_request:
    paths:
      - 'scripts/collect-all-prices.js'
      - 'scripts/test-second-pass.js'
      - 'scripts/test-price-mall-collection.js'
      - 'scripts/test-collector-scale.js'
      - 'scripts/test-collector-coverage.js'
      - 'api/_blockreason.js'
      - 'api/_collector-*.js'
      - 'api/_coupang.js'
      - 'api/_adpick.js'
      - 'api/cron.js'
      - 'scripts/test-collector-*.js'
      - 'scripts/_collector-sql-harness.js'
      - 'scripts/replay-collector-efficiency.js'
      - 'api/_shop.js'
      - 'api/_query.js'
      - 'api/_collectplan.js'
      - 'scripts/_nomatch-analysis.js'
      - 'scripts/analyze-nomatch.js'
      - 'scripts/test-nomatch-recall.js'
      - '.github/workflows/daily-prices.yml'
      - 'package.json'
      - 'reports/collector-efficiency-*.json'
      - 'supabase/migrations/**'
      - 'supabase/2026-09-22-collector-target-keyset.sql'
      - '.github/workflows/collector-regression.yml'
  workflow_dispatch:

jobs:
  collector-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Disposable PostgreSQL for multi-backend claim/progress races (test-collector-ledger-pg.js).
    # 15 is the older Supabase major; PGlite in the same suite covers 17.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Second-pass and budget regression
        run: node scripts/test-second-pass.js
      - name: Mall collection/report regression
        run: node scripts/test-price-mall-collection.js
      # 2026-09-22 collector_target_products statement timeout 사고 회귀.
      # 100 / 1,000 / 10,000 / 60,000 규모에서 대상 조회·재개·중복 방지·
      # 상품별 최종 상태 합계를 고정한다. DB/외부 API 를 부르지 않는다.
      - name: Collector scale and durability regression
        run: node scripts/test-collector-scale.js
      # 2026-09-29 미시도 원인 회귀: 100개/호출 20회/5회 → 전부 시도, P0→P1→P2→P3 순서,
      # 일시 쿨다운 대기·거절 정지·예산 즉시 정지·체크포인트 이어받기·당일 캐시.
      - name: Collector coverage and priority regression
        run: node scripts/test-collector-coverage.js
      - name: Migration safety (static only, no DB credentials)
        run: node scripts/verify-migrations.js
      - name: Atomic query ledger, global progress, real SQL (PGlite + PostgreSQL 15 races) and replay
        env:
          COLLECTOR_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:collector-efficiency
