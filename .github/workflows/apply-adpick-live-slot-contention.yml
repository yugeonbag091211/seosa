name: Apply ADPICK live-slot contention fix

on:
  push:
    branches:
      - fix/adpick-live-slot-contention

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[adpick-live-slot-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adpick-live-slot-contention
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply limiter fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/_adpicklimit.js')
          s = p.read_text()
          old = """      let usedGlobal = false;
                if (a.global) {
                  const g = await a.global({ notBeforeMs: slot - t, maxWaitMs: deadline - t });
                  const after = now();
                  if (!g.ok) return { ok: false, kind: 'global', reason: g.reason || '전역 한도', waitMs: g.waitMs || 0 };
                  if (!g.skipped) {
                    usedGlobal = true;
                    // 응답을 받은 시각을 기준으로 잡는다 — 실제보다 늦게 잡는 쪽이라 안전하다.
                    slot = Math.max(slot, after + Math.max(0, g.waitMs || 0));
                  }
                  t = after;
                }
                pendingSlot = slot;
                try {
                  while (now() < slot) await sleep(slot - now());
                } finally {
                  pendingSlot = 0;
                }
          """
          new = """      /*
               * 로컬 간격 때문에 미래 슬롯을 기다려야 하면 «먼저» 그만큼 잔다.
               *
               * 예전에는 전역 adpick_acquire 에 notBeforeMs=12초 같은 미래 시각을 먼저
               * 예약한 뒤 잤다. SQL 은 예약 시각을 단조 증가시키므로, 다른 프로세스의
               * 실시간 AI(maxWaitMs=0)가 그 12초 사이 지금 비어 있는 슬롯을 써도 안전한데
               * 미래 예약 뒤로 밀려 즉시 거절됐다. 수집기가 트래픽을 선점하는
               * head-of-line blocking 이었다.
               *
               * 로컬 pacing 은 이 프로세스만의 규칙이라 DB 슬롯을 미리 잡을 이유가 없다.
               * 로컬 시간이 된 뒤 전역 슬롯을 예약하면 공식 분당 한도는 그대로 지키면서
               * 다른 프로세스가 그 전의 빈 슬롯을 사용할 수 있다.
               */
              if (slot > t) {
                pendingSlot = slot;
                try {
                  while (now() < slot) await sleep(slot - now());
                } finally {
                  pendingSlot = 0;
                }
                t = now();
              }

              let usedGlobal = false;
              if (a.global) {
                const g = await a.global({ notBeforeMs: 0, maxWaitMs: Math.max(0, deadline - t) });
                const after = now();
                if (!g.ok) return { ok: false, kind: 'global', reason: g.reason || '전역 한도', waitMs: g.waitMs || 0 };
                if (!g.skipped) {
                  usedGlobal = true;
                  // 응답을 받은 시각을 기준으로 잡는다 — 실제보다 늦게 잡는 쪽이라 안전하다.
                  slot = after + Math.max(0, g.waitMs || 0);
                } else {
                  slot = after;
                }
                t = after;
              } else {
                // 로컬 대기를 이미 마쳤다. 실제 시작 기준으로 기록한다.
                slot = now();
              }

              if (slot > now()) {
                pendingSlot = slot;
                try {
                  while (now() < slot) await sleep(slot - now());
                } finally {
                  pendingSlot = 0;
                }
              }
          """
          if old not in s:
              raise SystemExit('limiter target block not found')
          p.write_text(s.replace(old, new))

          p = Path('scripts/test-adpick-limit.js')
          s = p.read_text()
          s = s.replace(
              ' *   6) 전역 예약 뒤 한참 늦게 깨면(멈춤) 부르지 않는다\n',
              ' *   6) 전역 예약 뒤 한참 늦게 깨면(멈춤) 부르지 않는다\n *   7) 수집기의 미래 로컬 슬롯은 전역에 선예약하지 않아 실시간 호출을 막지 않는다\n'
          )
          marker = "  console.log(`\\n====================================================\\nPASS ${pass}  /  FAIL ${fail}`);\n"
          block = """  console.log('\\n[7] 수집기 미래 로컬 슬롯이 실시간 호출의 빈 전역 슬롯을 선점하지 않는다');
            {
              const clock = virtualClock(() => 0);
              const rand = () => 0;
              const G = fakeGlobal(clock, { rand });
              const collector = L.createLimiter({ maxPerMin: 5, minGapMs: 12000, now: clock.now, sleep: clock.sleep });
              const live = L.createLimiter({ maxPerMin: 3, minGapMs: 10000, now: clock.now, sleep: clock.sleep });
              const collectGlobal = L.createGlobalAcquire({
                rpc: G.rpc, bucket: 'search', maxPerMin: 8, marginMs: 1000, isMissingObject: () => false, source: 'collect'
              });
              const liveGlobal = L.createGlobalAcquire({
                rpc: G.rpc, bucket: 'search', maxPerMin: 8, marginMs: 1000, isMissingObject: () => false, source: 'ai'
              });

              const firstP = collector.acquire({
                maxWaitMs: 60000,
                global: a => collectGlobal({ ...a, source: 'collect' })
              });
              await clock.run();
              const first = await firstP;
              check('첫 수집 호출이 전역 슬롯을 정상 사용한다', first.ok, first.reason);

              const secondP = collector.acquire({
                maxWaitMs: 60000,
                global: a => collectGlobal({ ...a, source: 'collect' })
              });
              await flush();
              check('★ 12초 로컬 대기 중에는 미래 전역 슬롯을 아직 예약하지 않는다', G.calls.n === 1, `global rpc ${G.calls.n}회`);

              const liveP = live.acquire({
                maxWaitMs: 0,
                global: a => liveGlobal({ ...a, source: 'ai' })
              });
              await clock.run();
              const liveResult = await liveP;
              const second = await secondP;

              check('★ 실시간 AI(maxWaitMs=0)가 수집기 대기 중 빈 슬롯을 즉시 사용한다', liveResult.ok, liveResult.reason);
              check('두 번째 수집 호출도 이후 정상 진행한다', second.ok, second.reason);
              check('실시간 슬롯이 두 번째 수집 슬롯보다 먼저 잡힌다',
                liveResult.ok && second.ok && liveResult.startMs < second.startMs,
                liveResult.ok && second.ok ? `${liveResult.startMs} < ${second.startMs}` : '호출 실패');
              const stats = L.rollingStats(G.slots);
              check('전역 60초 상한은 그대로 지킨다', stats.maxIn60s <= 8, `최대 ${stats.maxIn60s}회`);
            }

          """
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          p.write_text(s.replace(marker, block + marker))
          PY

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-adpick-limit.js
          node scripts/test-adpick-observability.js
          node scripts/test-collector-coverage.js
          npm test
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/_adpicklimit.js scripts/test-adpick-limit.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(adpick): avoid future-slot head-of-line blocking [adpick-live-slot-applied]"
          git push origin HEAD:fix/adpick-live-slot-contention
