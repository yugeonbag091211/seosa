name: SEOSA Waitroom (gated)

# ── ② 구매 대기실 — 목표가 도달 메일 ─────────────────────────────────────
#
# ★ 저장소 변수 WAITROOM_ENABLED=1 이 없으면 job 이 통째로 건너뛰어진다.
#   supabase/2026-09-24-seosa2-waitroom.sql 을 운영에 적용하고 승인을 받은 뒤에만
#   Settings > Secrets and variables > Actions > Variables 에서 켠다.
#
# ★ 가격을 수집하지 않는다. 쿠팡·ADPICK 을 부르지 않는다. 이미 쌓인 price_history 를
#   읽고, 대기실 표(waitroom_items / waitroom_notifications)에만 쓴다.
#
# 시각: 마지막 가격 수집 칸(KST 08:30, daily-prices.yml)과 핫딜(KST 09:20) 뒤인
#       KST 09:40 에 한 번. 예약이 밀려도 스크립트는 멱등이다 — 같은 날 두 번 돌아도
#       waitroom_notifications (item_id, notify_date) UNIQUE 가 두 번째 메일을 막는다.

on:
  schedule:
    - cron: '40 0 * * *'    # UTC 00:40 = KST 09:40
  workflow_dispatch:
    inputs:
      dry_run:
        description: '판정만 하고 메일·저장은 하지 않음'
        type: boolean
        default: true
      only_email:
        description: '이 주소의 항목만 처리 (운영자 시험 발송). 공개 저장소라 주소 대신 sha256(소문자 주소) 권장. WAITROOM_ENABLED 가 꺼져 있을 때 실제 발송은 필수'
        type: string
        default: ''

concurrency:
  group: seosa-waitroom
  cancel-in-progress: false

jobs:
  check:
    # 예약 실행은 WAITROOM_ENABLED=1 일 때만. 수동 실행은 운영자의 명시적 동작이라 dry-run·시험 발송을 허용한다.
    if: vars.WAITROOM_ENABLED == '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Check waitroom targets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          WAITROOM_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          WAITROOM_ONLY_EMAIL: ${{ github.event.inputs.only_email }}
          WAITROOM_ENABLED: ${{ vars.WAITROOM_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 정기 발송이 꺼진 상태의 수동 실제 발송은 운영자 주소 한 곳으로만 (전체 사용자 일괄 발송 금지)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WAITROOM_DRY_RUN" != "true" ] && [ "$WAITROOM_ENABLED" != "1" ] && [ -z "$WAITROOM_ONLY_EMAIL" ]; then
            echo "WAITROOM_ENABLED 가 꺼져 있을 때 실제 발송은 only_email 이 필요합니다." >&2
            exit 1
          fi
          node scripts/check-waitroom.js
