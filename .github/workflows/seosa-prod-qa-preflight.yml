name: SEOSA Production QA cloud preflight
on:
  push:
    branches:
      - codex/seosa-qa-durable-20261103
    paths:
      - .github/workflows/seosa-prod-qa-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Production network and cost-log credentials
        id: checks
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          origin_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://seosa.ai.kr/)"
          configured=false
          if [[ -n "$VERCEL_TOKEN" ]]; then configured=true; fi
          printf 'origin_http=%s\nvercel_token_configured=%s\n' "$origin_code" "$configured" | tee preflight.txt
          printf 'origin_http=%s\n' "$origin_code" >> "$GITHUB_OUTPUT"
          printf 'vercel_token_configured=%s\n' "$configured" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: seosa-qa-cloud-preflight
          path: preflight.txt
          retention-days: 7
