name: SEOSA HOT

# ── 왜 별도 워크플로인가 ──────────────────────────────────────────────
#
# 가격 수집(daily-prices.yml)과 실패를 공유하지 않기 위해서다. 핫딜 판정은
# 그 수집 «결과를 읽는» 작업이라, 수집이 부분 실패한 날에도 있는 데이터로
# 판정하면 된다. 반대로 핫딜 판정이 터져도 가격 수집은 계속돼야 한다.
#
# ── 왜 하루 두 번인가 (PHASE 18: 빠른 것보다 정확한 것) ─────────────
#
# 실측(2026-09-06 dry-run): 상품 2,230건을 판정하는 데 13초, 외부 API 호출
# 0회, Supabase SELECT 만 쓴다. 자주 돌려도 비용은 거의 없지만 «값이 바뀌지
# 않으면 판정도 바뀌지 않는다» — 가격 수집이 하루 한 바퀴이므로 그보다
# 자주 돌 이유가 없다.
#
#   09:20 KST (00:20 UTC)  그날 새벽 수집이 끝난 뒤 첫 판정
#   21:20 KST (12:20 UTC)  낮 동안 /api/search 로 갱신된 값 반영
#
# 실데이터가 쌓인 뒤 노출 건수와 만료 정확도를 보고 주기를 조정한다.

on:
  schedule:
    - cron: '20 0 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '판정만 하고 저장하지 않음'
        type: boolean
        default: false

concurrency:
  # 앞 실행이 아직 돌고 있으면 새 실행을 시작하지 않는다.
  # 스크립트 안에도 전용 hotdeal_job_state 잠금이 있어 이중으로 막는다.
  group: seosa-hot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      # ADPICK_AFFILIATE_ID는 공식 쇼핑메이트 핫딜 SDK용 회원 식별자다.
      # GitHub Secret이 없으면 빈 문자열이 전달되고 ADPICK source만 자동 비활성화된다.
      # 값 자체는 코드/로그에 남기지 않는다.
      - name: Collect verified hot deals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADPICK_AFFILIATE_ID: ${{ secrets.ADPICK_AFFILIATE_ID }}
        run: |
          node scripts/collect-hotdeals.js \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            2>&1 | tee /tmp/hotdeals.log
          exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        run: |
          echo "## SEOSA HOT" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          grep -E '"msg":"(grouped|evaluated|expired_ended|upserted|dry_run_no_write|failed)"' /tmp/hotdeals.log \
            | tail -8 >> $GITHUB_STEP_SUMMARY || echo '{"msg":"no log"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
