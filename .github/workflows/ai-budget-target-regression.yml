name: AI Budget Target Regression
on:
  push:
    branches:
      - fix/ai-targeted-budget-followup-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node scripts/test-ai-budget-target.js
      - run: node scripts/test-ai-comparison-followups.js
      - run: node scripts/test-ai-comparison-holdout.js
      - run: node scripts/test-ai-tablet-comparison.js
