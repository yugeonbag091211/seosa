name: Product Kind Classification (background)

# ── 왜 이 워크플로가 생겼나 (2026-11-25) ─────────────────────────────
#
# "본품 vs 부속" GPT 분류(api/_product-kind-classifier.js)는 원래 손님이
# 검색할 때 그 자리에서 처음 보는 상품을 물어봤다. 운영 환경에서 Codex로
# 직접 돌려보니 그 첫 질문 한 번에 검색이 1.8~2.9초 더 걸렸다(실측).
#
# 그래서 "GPT에게 묻고 저장"하는 일을 손님 요청과 완전히 떼어내 여기서
# 미리 해 둔다. 손님이 검색할 때는 api/_product-kind-store.js의
# lookupProductKinds가 이미 저장된 값만 읽는다 — GPT를 부르지 않으므로
# 수십 ms밖에 안 걸린다. scripts/classify-product-kinds-batch.js 참고.
#
# ── 왜 하루 한 번이면 충분한가 ───────────────────────────────────────
#
# 새 상품은 매일의 가격 수집(daily-prices.yml)으로만 늘어난다. 하루 한 번
# 분류 대상을 쓸어가도, 못 쓸어간 상품은 손님 검색에서 "모른다"로 남아
# 기존 사전(ACCESSORY_TIER) 가드만 적용될 뿐 검색이 막히지는 않는다
# (api/search.js의 kindFiltered 안전장치). 비용·호출량을 생각하면 촘촘한
# 칸을 깔 이유가 없다 — daily-prices.yml 과는 사정이 다르다.
#
# ── 비용 ────────────────────────────────────────────────────────────
#
# Codex 실측(2026-11-25): 상품 1개 분류에 평균 입력 ~430 토큰 / 출력 ~22
# 토큰, 비용 약 $0.00005/개. 기본 한도 1,000개/실행이면 하루 약 $0.05 수준.
#
# ── 이어 붙이기 (2026-11-26) ─────────────────────────────────────────
#
# 처음 켜는 날처럼 밀린 게 몇만 건이면 하루 1,000개씩으로는 몇 달이 걸린다.
# daily-prices.yml 과 같은 패턴으로, 이번 실행이 끝난 뒤에도 미분류 상품이
# 남아있으면(scripts/classify-product-kinds-batch.js 가 남기는 표식) 바로
# 다음 실행을 스스로 만든다. 사슬 길이는 MAX_CHAIN 으로 상한을 둔다 —
# 끝이 안 나는 사고를 막기 위해서다. 그래도 안 끝났으면 다음 예약 칸
# (하루 1회)이 이어받는다.
on:
  schedule:
    # UTC 18:00 = KST 03:00 — daily-prices.yml 의 야간 수집 창(KST 01~08) 뒤라,
    # 그날 새로 들어온 상품이 이미 products 테이블에 쌓여 있을 시간대다.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      rows:
        description: '이번 실행에서 다룰 최대 상품 수'
        required: false
        default: '1000'
      dry_run:
        description: 'true면 GPT 호출·저장 없이 대상 개수만 확인'
        type: boolean
        required: false
        default: false
      chain:
        description: '이어 붙이기 사슬 깊이 (수동 실행은 0 으로 둔다)'
        required: false
        default: '0'

concurrency:
  group: product-kind-classify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write 는 마지막 단계(이어 붙이기)가 workflow_dispatch 를 만들 때만 쓴다.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Classify unclassified products
        id: classify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEOSA_DB_BACKEND: ${{ vars.SEOSA_DB_BACKEND }}
          SEOSA_NEON_EXPERIMENTAL: ${{ vars.SEOSA_NEON_EXPERIMENTAL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRODUCT_KIND_BATCH_ROWS: ${{ github.event.inputs.rows || '1000' }}
          PRODUCT_KIND_CONTINUE_MARKER: /tmp/product-kind-continue.json
          # 긴급 중단: Settings -> Variables -> Actions PRODUCT_KIND_BATCH_OFF=1
          PRODUCT_KIND_BATCH_OFF: ${{ vars.PRODUCT_KIND_BATCH_OFF }}
        run: |
          if [ "${PRODUCT_KIND_BATCH_OFF}" = "1" ]; then
            echo "PRODUCT_KIND_BATCH_OFF=1 — 이번 실행은 건너뜁니다."
            exit 0
          fi
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/classify-product-kinds-batch.js $ARGS 2>&1 | tee /tmp/product-kind-batch.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## 본품/부속 배치 분류"
            echo ""
            echo '```'
            tail -5 /tmp/product-kind-batch.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 이어 붙이기(2026-11-26) ────────────────────────────────────────
      # classify 단계가 성공했고(에러로 멈춘 게 아니고), dry-run이 아니고,
      # 아직 미분류 상품이 남아있다는 표식(/tmp/product-kind-continue.json)이
      # 있을 때만 다음 실행을 만든다. 실패해도 빨간불로 만들지 않는다
      # (continue-on-error) — 다음 예약 칸(하루 1회)이 이어받는다.
      - name: Continue classification (dispatch next run)
        if: always() && steps.classify.outcome == 'success' && github.event.inputs.dry_run != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain }}
          MAX_CHAIN: '200'
        run: |
          if [ ! -f /tmp/product-kind-continue.json ]; then
            echo "이어 붙이지 않음 — 미분류 상품이 안 남았거나 표식 생략됨"
            exit 0
          fi
          case "$CHAIN" in ''|*[!0-9]*) CHAIN=0 ;; esac
          if [ "$CHAIN" -ge "$MAX_CHAIN" ]; then
            echo "사슬 상한 $MAX_CHAIN 도달 — 다음 예약 칸(내일)에 맡긴다"
            exit 0
          fi
          gh workflow run product-kind-classify.yml --ref main \
            -f rows="${{ github.event.inputs.rows || '1000' }}" \
            -f chain=$((CHAIN + 1))
          echo "다음 실행을 만들었습니다 (chain=$((CHAIN + 1)))"
