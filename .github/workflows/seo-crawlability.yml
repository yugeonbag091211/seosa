name: SEO crawlability regression
on:
  push:
    branches: [main]
    paths:
      - 'api/_product-page.js'
      - 'api/_seo-pages.js'
      - 'scripts/test-seo.js'
      - 'scripts/test-product-page.js'
      - 'scripts/test-p2-resilience.js'
      - 'supabase/2026-10-02-seo-sitemap.sql'
      - 'supabase/2026-10-02-seo-sitemap.VERIFY.sql'
      - '.github/workflows/seo-indexability.yml'
      - '.github/workflows/seo-crawlability.yml'
  pull_request:
    paths:
      - 'api/_seo-pages.js'
      - 'scripts/test-seo.js'
      - 'docs/seo.md'
      - '.github/workflows/seo-crawlability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo-crawlability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: SEO structure and HTML navigation
        run: node scripts/test-seo.js
      - name: Product pages and their indexability
        run: node scripts/test-product-page.js
