name: Mobile Check

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-check.yml'
  workflow_dispatch:

concurrency:
  group: seosa-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck, lint and test
        run: npm run check
