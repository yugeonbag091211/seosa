name: AI timeout patch

on:
  push:
    branches:
      - fix/ai-response-timeout-race
    paths:
      - .github/workflows/ai-timeout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-response-timeout-race

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch timeout ownership
        run: python3 scripts/apply-ai-timeout-fix.py

      - name: Verify timeout contract
        run: node scripts/test-ai-timeout-contract.js

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Focused regressions
        run: |
          node scripts/test-user-flow.js
          node scripts/test-ai-pipeline.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "SEOSA AI Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html vercel.json
          git diff --cached --check
          git commit -m "fix: prevent AI response timeout race"
          git push origin HEAD:fix/ai-response-timeout-race
