name: Apply AI model-line identity v2

on:
  push:
    branches:
      - fix/ai-identity-model-line-qualifiers-v2

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[model-line-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-identity-model-line-qualifiers-v2
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply PR147 on top of latest main and close Ti/XT reverse gap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 3f843fb264a54250d76f51d6ff635a876deb4049
          git show 3f843fb264a54250d76f51d6ff635a876deb4049:api/_aiidentity.js > api/_aiidentity.js
          git show 3f843fb264a54250d76f51d6ff635a876deb4049:scripts/test-ai-identity-model-line.js > scripts/test-ai-identity-model-line.js

          node - <<'NODE'
          const fs = require('fs');

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          if (!pkg.scripts.test.includes('test-ai-identity-model-line.js')) {
            pkg.scripts.test = pkg.scripts.test.replace(
              'node scripts/test-live-redteam-regressions.js &&',
              'node scripts/test-live-redteam-regressions.js && node scripts/test-ai-identity-model-line.js &&'
            );
          }
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const aiPath = 'api/_aiidentity.js';
          let ai = fs.readFileSync(aiPath, 'utf8');
          const oldHelper = `/* 상품명에서 앵커 바로 뒤에 붙은 영문 한 글자 ("G304 X", "G502 X PLUS") — 계열이 다른 모델 표시. */
          function titleLineLetters(anchors, tokens) {
            const out = new Set();
            anchors.forEach(anchor => {
              for (let i = 0; i < tokens.length; i++) {
                let s = '';
                for (let j = i; j < Math.min(tokens.length, i + 3); j++) {
                  s += tokens[j];
                  if (s === anchor) { if (/^[a-z]$/.test(tokens[j + 1] || '')) out.add(tokens[j + 1]); break; }
                  if (s.length >= anchor.length) break;
                }
              }
            });
            return out;
          }
          `;
          const newHelper = `/*
           * 상품명에서 앵커 바로 뒤에 붙은 짧은 영문 계열 suffix.
           *
           * 한 글자(X)뿐 아니라 그래픽카드의 Ti/XT처럼 2글자 suffix도 다른 SKU를 뜻한다.
           * 길이를 2자로 제한한다 — G304 LIGHTSPEED처럼 긴 마케팅/계열 낱말을 plain G304
           * 질의에서 근거 없이 다른 모델로 밀어내지 않는다. query 쪽에서 명시한 긴 qualifier는
           * modelLineQualifiers/missing 검사가 이미 잡는다.
           */
          function titleLineSuffixes(anchors, tokens) {
            const out = new Set();
            anchors.forEach(anchor => {
              for (let i = 0; i < tokens.length; i++) {
                let joined = '';
                for (let j = i; j < Math.min(tokens.length, i + 3); j++) {
                  joined += tokens[j];
                  if (joined === anchor) {
                    const next = tokens[j + 1] || '';
                    if (/^[a-z]{1,2}$/.test(next) && !categoryNounOf(next)) out.add(next);
                    break;
                  }
                  if (joined.length >= anchor.length) break;
                }
              }
            });
            return out;
          }
          `;
          if (ai.includes(oldHelper)) {
            ai = ai.replace(oldHelper, newHelper);
          } else if (!ai.includes('function titleLineSuffixes(')) {
            throw new Error('model-line helper target not found');
          }
          ai = ai.replace('titleLineLetters(c.anchors, info.tokens)', 'titleLineSuffixes(c.anchors, info.tokens)');
          fs.writeFileSync(aiPath, ai);

          const testPath = 'scripts/test-ai-identity-model-line.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const needle = `  ['RTX 5070 Ti 그래픽카드', 'MSI 지포스 RTX 5070 Ti 게이밍 그래픽카드', TIER.EXACT],\n`;
          const addition = `  ['RTX 5070 Ti 그래픽카드', 'MSI 지포스 RTX 5070 Ti 게이밍 그래픽카드', TIER.EXACT],\n  // 역방향도 분리: plain 모델 질의에 짧은 계열 suffix(Ti/XT)가 붙은 SKU는 형제다.\n  ['RTX 5070 그래픽카드', 'MSI 지포스 RTX 5070 Ti 게이밍 그래픽카드', TIER.SIBLING],\n  ['RX 7900 그래픽카드', 'AMD Radeon RX 7900 XT 그래픽카드', TIER.SIBLING],\n  // 긴 마케팅/계열 낱말은 plain anchor만으로 과잉 분리하지 않는다.\n  ['로지텍 G304 무선 마우스', G304_LS, TIER.EXACT],\n`;
          if (!test.includes('RX 7900 그래픽카드')) {
            if (!test.includes(needle)) throw new Error('RTX test insertion target not found');
            test = test.replace(needle, addition);
          }
          fs.writeFileSync(testPath, test);
          NODE

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-ai-identity-model-line.js
          node scripts/test-ai-canonical-candidates.js
          node scripts/test-search-adversarial.js --split dev
          npm test
          git diff --check

      - name: Commit fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/_aiidentity.js scripts/test-ai-identity-model-line.js package.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(ai): distinguish model-line suffixes including Ti/XT [model-line-v2-applied]"
          git push origin HEAD:fix/ai-identity-model-line-qualifiers-v2
