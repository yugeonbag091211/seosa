name: Daily Price Collection

on:
  schedule:
    # 한국시간 새벽 1시 — 그날 작업 시작 (KST 기준 새 날이라 1번 상품부터)
    - cron: '0 16 * * *'   # UTC 16:00 = KST 01:00
    # 보충 실행. 위 실행이 시간 예산·중단으로 다 못 돌았으면 이어서 처리한다.
    # 이미 completed 인 날이면 price_job_state 를 한 번 읽고 즉시 끝난다
    # (상품 조회도 쿠팡 호출도 하지 않음).
    - cron: '0 18 * * *'   # UTC 18:00 = KST 03:00
    - cron: '0 21 * * *'   # UTC 21:00 = KST 06:00
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    # 배치 루프가 1분 간격으로 돈다. 수집 대상 770개 / 배치당 20여 개
    # → 약 39배치 ≈ 39분. 스크립트 자체 예산은 PRICE_RUN_BUDGET_MS(기본 50분)이고,
    # 여기서는 그보다 넉넉히 잡아 npm ci·알림 단계까지 여유를 둔다.
    # 예산을 넘기면 스크립트가 진행 상태를 저장하고 정상 종료하므로,
    # 타임아웃에 잘려도 다음 실행이 커서부터 이어받는다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Collect all product prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          node scripts/collect-all-prices.js 2>&1 | tee /tmp/collect.log
          exit ${PIPESTATUS[0]}

      # 수집이 실패해도 알림 확인은 돌린다.
      # 오늘 수집분이 없으면 check-alerts.js 가 알아서 0건으로 끝나므로 해가 없고,
      # 부분적으로만 수집된 날에 알림이 통째로 빠지는 것을 막는다.
      - name: Check price alerts and send notifications
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node scripts/check-alerts.js

      - name: Coverage summary
        if: always()
        run: |
          echo "## Daily Price Collection Log" >> $GITHUB_STEP_SUMMARY
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/collect.log 2>/dev/null || echo "(로그 없음 — 수집 단계 도달 전 실패)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
