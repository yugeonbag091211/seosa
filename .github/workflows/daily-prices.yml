name: Daily Price Collection

on:
  schedule:
    # ── 왜 한 시간 간격으로 여덟 번인가 (2026-09-03 감사) ──────────────
    #
    # 한 실행이 쓸 수 있는 쿠팡 호출은 시간이 정한다:
    #   쿠팡 몫 42분(COUPANG_BUDGET_MS) ÷ 호출 간격 6초 = 420회/실행
    # 그리고 하루에 필요한 호출은 실측으로 계산된다:
    #   1차 패스        399회  → 상품 756/1,548 확보 (48.8%, 오프라인 재현으로 검증)
    #   회수 패스     ~1,330회 → 나머지 792개 중 약 690개 회수
    #                            (실측: 미수집 실상품 45개 표본, 회수율 77.8%,
    #                             회수 1개당 2.17회 — scripts 로 측정)
    #   합계         ~1,730회/일  → 실행 5회분
    #
    # 그런데 예전에는 cron 세 칸(16·18·21시)뿐이었고, 그중 실제로 일을 한
    # 실행은 하루 2회였다. GitHub Actions 는 예약 시각을 지키지 않고 밀린다 —
    # 실측(2026-09-02): 16:00 예약 → 19:14 시작, 18:00 예약 → 20:13 시작,
    # 21:00 예약 → 22:55 시작. 즉 "칸이 몇 개인가" 가 곧 "몇 번 도는가" 다.
    #
    # 그래서 KST 01~08시(UTC 16~23시)에 한 시간 간격으로 칸을 깔아 둔다.
    #   · 앞 실행이 아직 돌고 있으면 → 잠금(CAS)에 걸려 즉시 종료한다
    #   · 그날 작업이 이미 끝났으면  → price_job_state 한 줄만 읽고 종료한다
    #     (상품 조회도 쿠팡 호출도 하지 않는다. 실측 소요 12~20초)
    # 어느 쪽도 쿠팡을 부르지 않으므로, 칸을 늘려도 API 호출 속도는 그대로다.
    # 늘어나는 것은 "이어받을 기회" 뿐이다.
    #
    # ★ 분당 호출 속도는 한 자리도 바뀌지 않는다 — COUPANG_MIN_GAP_MS(6초),
    #   _coupang.MAX_PER_MIN(20), 쿠팡 공식 한도(50/분) 전부 그대로다.
    #
    # UTC 15~23시는 전부 같은 KST 날짜(00~08시)라, 이 칸들이 하루 작업 하나를
    # 나눠 이어받는다 (job_date 는 KST 기준 — api/_price.kstToday).
    #
    # ── 왜 30분 간격으로 촘촘하게 깔았는가 (2026-09-08 감사) ──────────────
    #
    # 위 문단이 옳았는데 아직 부족했다. 한 시간 간격 여덟 칸으로도 하루가
    # 통째로 새는 날이 있다. 실측(KST 2026-09-08, gh run list):
    #
    #   ① 예약된 칸이 아예 발화하지 않는다.
    #      UTC 16·17·18시 칸이 실행 자체가 만들어지지 않았다. 그날 첫 실행은
    #      19:37 이었다 — 앞의 세 시간을 통째로 잃었다. GitHub Actions 는
    #      부하가 걸리면 예약 실행을 미루는 정도가 아니라 «버린다».
    #
    #   ② 실행이 끝난 뒤 다음 칸까지 놀고 있다.
    #      실행 종료 → 다음 실행 시작 사이 유휴가 25분 + 8분 + 39분 = 72분.
    #      쿠팡 몫으로 환산하면 회수 호출 약 720회, 실측 회수율 0.6개/호출로
    #      상품 약 430개어치다.
    #
    #   결과: 그날 «일을 한» 실행은 7개 칸 중 4회뿐이었고, 쿠팡 호출은
    #   1,674회에 그쳤다(하루 상한 미달). 같은 카탈로그로 여덟 칸이 정상
    #   발화한 09-06 은 2,200회를 다 쓰고 87.6% 를 찍었다.
    #
    # 그래서 칸을 30분 간격으로 깔고 UTC 15:00(KST 00:00, 그날의 첫 순간)부터
    # 시작한다. ①은 칸이 많을수록 «전부 버려질» 확률이 급격히 떨어져 덮이고,
    # ②는 실행이 끝나고 최대 30분 안에 다음 칸이 이어받아 덮인다.
    #
    # ★ 이것이 호출을 늘리지 않는다는 근거는 위 문단 그대로다. 헛도는 칸은
    #   쿠팡도 ADPICK 도 부르지 않는다 —
    #     · 앞 실행이 진행 중  → acquireLock 이 CAS 로 막고 즉시 종료
    #       (잠금 실패 경로는 DB 쓰기조차 하지 않는다 — collect-all-prices.js
    #        run() 은 loadState 읽기 뒤 바로 return 한다)
    #     · 그날 작업이 끝남  → price_job_state 한 줄 읽고 종료
    #   둘 다 실측 소요 20초 안팎이고 외부 API 호출 0회다.
    #
    # ★ 분당 호출 속도는 여전히 한 자리도 바뀌지 않는다 —
    #   COUPANG_MIN_GAP_MS(6초 = 분당 10회), _coupang.MAX_PER_MIN(전역 20회/분),
    #   쿠팡 공식 한도(검색 50회/분) 전부 그대로다. 하루 총량의 천장도
    #   COUPANG_DAY_BUDGET 이 그대로 지킨다 — 칸이 아무리 많아도 그 값을
    #   넘길 수 없다. 늘어나는 것은 "이어받을 기회" 뿐이다.
    - cron: '0 15 * * *'    # UTC 15:00 = KST 00:00  ← 그날 작업 시작
    - cron: '30 15 * * *'   # UTC 15:30 = KST 00:30
    - cron: '0 16 * * *'    # UTC 16:00 = KST 01:00
    - cron: '30 16 * * *'   # UTC 16:30 = KST 01:30
    - cron: '0 17 * * *'    # UTC 17:00 = KST 02:00
    - cron: '30 17 * * *'   # UTC 17:30 = KST 02:30
    - cron: '0 18 * * *'    # UTC 18:00 = KST 03:00
    - cron: '30 18 * * *'   # UTC 18:30 = KST 03:30
    - cron: '0 19 * * *'    # UTC 19:00 = KST 04:00
    - cron: '30 19 * * *'   # UTC 19:30 = KST 04:30
    - cron: '0 20 * * *'    # UTC 20:00 = KST 05:00
    - cron: '30 20 * * *'   # UTC 20:30 = KST 05:30
    - cron: '0 21 * * *'    # UTC 21:00 = KST 06:00
    - cron: '30 21 * * *'   # UTC 21:30 = KST 06:30
    - cron: '0 22 * * *'    # UTC 22:00 = KST 07:00
    - cron: '30 22 * * *'   # UTC 22:30 = KST 07:30
    - cron: '0 23 * * *'    # UTC 23:00 = KST 08:00
    - cron: '30 23 * * *'   # UTC 23:30 = KST 08:30
    # ── 낮에도 30분마다 이어받는다 (2026-09-29) ─────────────────────────
    #
    # 대상 12,705개(쿠팡 4,966 / ADPICK 7,745)의 1차 검색어는 쿠팡 2,510종 · ADPICK 2,784종이다.
    # ADPICK 은 분당 5회라 1차만 557분(= 50분 실행 11~12회)이 필요한데, 09-29 에 실제로 일한
    # 정기 실행은 8회였다(낮 칸 3개 중 1개만 06:58Z 에 1시간 41분 늦게 떴다). 한 실행을 길게
    # 늘리는 대신(잠금·러너 장애 위험) 체크포인트 + 이어받기 칸을 촘촘히 깐다.
    # 칸이 늘어도 호출 속도·하루 총량은 그대로다 — 앞 실행이 돌면 잠금(heartbeat)에 걸려,
    # 그날 일이 끝났으면 상태 한 줄만 읽고 20초 안에 끝난다(외부 API 0회). 공개 저장소라
    # Actions 분도 과금되지 않는다. 정각 혼잡을 피해 :05/:35 에 둔다.
    - cron: '5,35 0-14 * * *' # UTC 00:05~14:35 = KST 09:05~23:35 (자정 마감은 수집기가 지킨다)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    # 스크립트 자체 예산은 PRICE_RUN_BUDGET_MS(기본 50분)이고, 여기서는 그보다
    # 넉넉히 잡아 npm ci·알림 단계까지 여유를 둔다. 예산을 넘기면 스크립트가
    # 진행 상태를 저장하고 정상 종료하므로, 타임아웃에 잘려도 다음 실행이
    # 커서부터 이어받는다.
    #
    # ── 50분 → 85분 (2026-10-03, 실측) ──────────────────────────────────
    #   예전에는 «다음 칸이 잠금에 걸려 건너뛰므로 실행 횟수를 잃는다» 며 50분에 묶었다.
    #   실제로는 48칸 중 하루 21칸만 발화하고(09-30~10-02 매일 21), 발화도 몇 시간씩
    #   비어 ADPICK 이 하루 1,440분 중 392~462분만 일했다(분당 4.8~4.9회, 호출 사이
    #   중앙값 12.3초 — 실행 안에서는 쉬는 시간이 없다). 그래서 ADPICK 은 하루 상한
    #   3,000회 중 1,872~2,240회만 쓰고 대상의 6.7~21.7%(531~1,731개)를 시도하지 못했다.
    #   그 3일의 실제 발화 시각으로 재현하면 활동 시간은 50분 450분/일(실측 459~462 와
    #   일치), 70분 560~630분, 85분 680분(≈3,300회 → 하루 상한 3,000 에서 멈춤).
    #   건너뛴 칸은 지금처럼 20초 안에 끝난다(외부 호출 0). 잠금은 체크포인트(90초)마다
    #   연장되고, 끊겨도 잃는 것은 마지막 90초뿐이다. 분당 속도(5회)·하루 상한·쿠팡 실행/하루
    #   예산은 하나도 바뀌지 않는다 — 쿠팡은 실행당 700회에서 먼저 멈춘다.
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ── V3 카나리 게이트 (2026-09-23) ─────────────────────────────────
      # PRICE_V3_CANARY_DATES 에 적힌 KST 날짜에만 수집기 V3 를 켠다. 날짜가 지나면
      # 저절로 레거시다. 그날 수집기가 429·차단·집계 불변조건 위반·잠금 상실·저장 0행을
      # 보면 price_job_state 에 비활성화 표식을 남기고, 그 뒤 칸은 레거시로 돈다.
      # 이 단계는 실패하지 않는다 — 어떤 오류든 PRICE_COLLECTOR_V3=0(레거시)로 떨어진다.
      #
      # ── 2026-09-26: 카나리 → 상시(자동 비활성화 유지) ──────────────────
      # 09-24 카나리 실측: 킬 0 · ADPICK 429 0 · 중복 0 · 옵션 자기모순 0 · 잠금 상실 0,
      #   ADPICK 740호출 → 2,621개(3.54/호출) · 쿠팡 3,400호출 → 2,427개. 리포트의
      #   추적옵션불일치 3건은 기록 뒤에 추적 옵션이 바뀐 재등록 착시(행 셋 다 기록 당시 일치).
      # 같은 카탈로그의 레거시(09-26): 직렬이라 ADPICK 이 실행당 8분(≈42호출)만 받아
      #   7,674개 중 17.5% 만 시도, 전체 23.4%.
      # PRICE_V3_ON_FROM 날짜부터 V3 로 돈다. 킬 표식이 서면 그날 남은 칸은 레거시다.
      # 배포 없이 끄려면 저장소 변수 PRICE_V3_OFF=1 (Settings → Variables → Actions).
      - name: V3 canary gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PRICE_V3_CANARY_DATES: '2026-09-24'
          PRICE_V3_ON_FROM: '2026-09-26'
          PRICE_V3_OFF: ${{ vars.PRICE_V3_OFF }}
        run: node scripts/v3-canary-gate.js

      - name: Collect all product prices
        env:
          # Enable only after the additive schema is verified in both Actions and Vercel.
          PRICE_QUERY_LEDGER: ${{ vars.PRICE_QUERY_LEDGER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ADPICK_API_KEY: ${{ secrets.ADPICK_API_KEY }}
          # ADPICK 상품 검색 공식 제한은 API 키 기준 분당 10회다. 2026-09-10
          # 운영에서 약 11회 호출 뒤 HTTP 429가 실측됐으므로 배치에는 다른 경로의
          # 여유를 남기기 위해 분당 최대 5회를 적용한다.
          # 12초 간격 + 모듈 자체 5회/분 상한의 이중 방어다.
          ADPICK_COLLECT_MIN_GAP_MS: '12000'
          ADPICK_MAX_PER_MIN: '5'
          # 모든 모드에 적용되는 ADPICK 하루 상한(코드 기본 740). 분당 속도는 위 5회 그대로다.
          # 근거: 공식 가이드는 검색 «분당 10회/키» 만 적고 일일 한도가 없다. 운영 실측
          #   09-18 하루 3,794회에서 429 10건은 전부 분당 초과였고 일일 차단은 없었다.
          #   09-24~26 429 0건, 수집기 외 ADPICK 사용은 하루 16~37회.
          # 5회/분으로 하루에 실제로 쓸 수 있는 양(작업 칸 × 50분)에 맞춘 값이다.
          # ── 1800 → 3000 (2026-09-29) ──
          # 09-29 대상 ADPICK 7,745개의 1차 검색어가 2,784종이라 1800 으로는 1차조차 끝나지
          # 않는다(그날 미호출 그룹 895종, 미시도 1,933개). 분당 속도(5회)는 그대로이고, 같은 날
          # 사용자가 돌린 캐치업이 3000 으로 외부 호출 2,271회를 쓰는 동안 429 는 0건이었다.
          # 공식 한도는 «분당 10회/키» 뿐이고 일일 한도는 문서에 없다.
          ADPICK_DAY_BUDGET: '3000'
          # 실행 예산 85분(위 timeout 주석의 실측). ADPICK 은 5회/분 × 85분 = 425회라
          # 실행당 상한을 450 으로 둔다(400 이면 80분에서 끊긴다). 하루 상한 3,000 은 그대로다.
          PRICE_RUN_BUDGET_MS: '5100000'
          ADPICK_RUN_BUDGET: '450'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          node scripts/collect-all-prices.js 2>&1 | tee /tmp/collect.log
          exit ${PIPESTATUS[0]}

      # 수집이 실패해도 알림 확인은 돌린다.
      # 오늘 수집분이 없으면 check-alerts.js 가 알아서 0건으로 끝나므로 해가 없고,
      # 부분적으로만 수집된 날에 알림이 통째로 빠지는 것을 막는다.
      - name: Check price alerts and send notifications
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node scripts/check-alerts.js

      - name: Coverage summary
        if: always()
        run: |
          echo "## Daily Price Collection Log" >> $GITHUB_STEP_SUMMARY
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/collect.log 2>/dev/null || echo "(로그 없음 — 수집 단계 도달 전 실패)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
