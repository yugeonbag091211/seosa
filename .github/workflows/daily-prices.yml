name: Daily Price Collection

on:
  schedule:
    # 30분 단위 이어받기 슬롯. Actions 예약은 지연·누락될 수 있으므로 실행 기회를 확보한다.
    # 앞 실행이 살아 있으면 CAS 잠금+heartbeat로 종료하고, 오늘 완료/예산 소진이면
    # 대상 상품을 읽기 전에 종료한다. 슬롯 추가는 호출 속도를 바꾸지 않는다.
    # 현재 쿠팡 collector: 최소 3초 / 최대 20회/분 / 실행당 실제 호출 900회.
    # Search operating 35회/분 중 사용자 interactive 15회/분을 예약한다.
    # DB rolling hard cap: Search 50회/분, 전체 API 100회/분 (operating 80회/분).
    # KST 일일 collect-source 상한 3400회는 로컬 예약과 DB 전역 gate가 함께 보호한다.
    # UTC 15~23시는 KST 00~08시이며 같은 날의 체크포인트를 이어받는다.
    - cron: '0 15 * * *'    # UTC 15:00 = KST 00:00  ← 그날 작업 시작
    - cron: '30 15 * * *'   # UTC 15:30 = KST 00:30
    - cron: '0 16 * * *'    # UTC 16:00 = KST 01:00
    - cron: '30 16 * * *'   # UTC 16:30 = KST 01:30
    - cron: '0 17 * * *'    # UTC 17:00 = KST 02:00
    - cron: '30 17 * * *'   # UTC 17:30 = KST 02:30
    - cron: '0 18 * * *'    # UTC 18:00 = KST 03:00
    - cron: '30 18 * * *'   # UTC 18:30 = KST 03:30
    - cron: '0 19 * * *'    # UTC 19:00 = KST 04:00
    - cron: '30 19 * * *'   # UTC 19:30 = KST 04:30
    - cron: '0 20 * * *'    # UTC 20:00 = KST 05:00
    - cron: '30 20 * * *'   # UTC 20:30 = KST 05:30
    - cron: '0 21 * * *'    # UTC 21:00 = KST 06:00
    - cron: '30 21 * * *'   # UTC 21:30 = KST 06:30
    - cron: '0 22 * * *'    # UTC 22:00 = KST 07:00
    - cron: '30 22 * * *'   # UTC 22:30 = KST 07:30
    - cron: '0 23 * * *'    # UTC 23:00 = KST 08:00
    - cron: '30 23 * * *'   # UTC 23:30 = KST 08:30
    # ── 낮에도 30분마다 이어받는다 (2026-09-29) ─────────────────────────
    #
    # 대상 12,705개(쿠팡 4,966 / ADPICK 7,745)의 1차 검색어는 쿠팡 2,510종 · ADPICK 2,784종이다.
    # ADPICK 은 분당 5회라 1차만 557분(= 50분 실행 11~12회)이 필요한데, 09-29 에 실제로 일한
    # 정기 실행은 8회였다(낮 칸 3개 중 1개만 06:58Z 에 1시간 41분 늦게 떴다). 한 실행을 길게
    # 늘리는 대신(잠금·러너 장애 위험) 체크포인트 + 이어받기 칸을 촘촘히 깐다.
    # 칸이 늘어도 호출 속도·하루 총량은 그대로다 — 앞 실행이 돌면 잠금(heartbeat)에 걸려,
    # 그날 일이 끝났으면 상태 한 줄만 읽고 20초 안에 끝난다(외부 API 0회). 공개 저장소라
    # Actions 분도 과금되지 않는다. 정각 혼잡을 피해 :05/:35 에 둔다.
    - cron: '5,35 0-14 * * *' # UTC 00:05~14:35 = KST 09:05~23:35 (자정 마감은 수집기가 지킨다)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    # 스크립트 자체 예산은 PRICE_RUN_BUDGET_MS(기본 50분)이고, 여기서는 그보다
    # 넉넉히 잡아 npm ci·알림 단계까지 여유를 둔다. 예산을 넘기면 스크립트가
    # 진행 상태를 저장하고 정상 종료하므로, 타임아웃에 잘려도 다음 실행이
    # 커서부터 이어받는다.
    #
    # ★ 50분을 더 늘리지 않는 이유: 실측상 다음 cron 실행이 약 60분 뒤에
    #   시작한다(위 주석의 19:14 → 20:13). 예산을 60분 너머로 잡으면 그때
    #   앞 실행이 아직 잠금을 쥐고 있어 다음 실행이 통째로 건너뛴다 —
    #   실행 하나를 길게 만드는 대신 실행 횟수를 잃는다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ── V3 카나리 게이트 (2026-09-23) ─────────────────────────────────
      # PRICE_V3_CANARY_DATES 에 적힌 KST 날짜에만 수집기 V3 를 켠다. 날짜가 지나면
      # 저절로 레거시다. 그날 수집기가 429·차단·집계 불변조건 위반·잠금 상실·저장 0행을
      # 보면 price_job_state 에 비활성화 표식을 남기고, 그 뒤 칸은 레거시로 돈다.
      # 이 단계는 실패하지 않는다 — 어떤 오류든 PRICE_COLLECTOR_V3=0(레거시)로 떨어진다.
      #
      # ── 2026-09-26: 카나리 → 상시(자동 비활성화 유지) ──────────────────
      # 09-24 카나리 실측: 킬 0 · ADPICK 429 0 · 중복 0 · 옵션 자기모순 0 · 잠금 상실 0,
      #   ADPICK 740호출 → 2,621개(3.54/호출) · 쿠팡 3,400호출 → 2,427개. 리포트의
      #   추적옵션불일치 3건은 기록 뒤에 추적 옵션이 바뀐 재등록 착시(행 셋 다 기록 당시 일치).
      # 같은 카탈로그의 레거시(09-26): 직렬이라 ADPICK 이 실행당 8분(≈42호출)만 받아
      #   7,674개 중 17.5% 만 시도, 전체 23.4%.
      # PRICE_V3_ON_FROM 날짜부터 V3 로 돈다. 킬 표식이 서면 그날 남은 칸은 레거시다.
      # 배포 없이 끄려면 저장소 변수 PRICE_V3_OFF=1 (Settings → Variables → Actions).
      - name: V3 canary gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PRICE_V3_CANARY_DATES: '2026-09-24'
          PRICE_V3_ON_FROM: '2026-09-26'
          PRICE_V3_OFF: ${{ vars.PRICE_V3_OFF }}
        run: node scripts/v3-canary-gate.js

      - name: Collect all product prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ADPICK_API_KEY: ${{ secrets.ADPICK_API_KEY }}
          # 쿠팡은 새 quota 변수만 사용한다. legacy COUPANG_MAX_PER_MIN은 적용되지 않는다.
          # 로컬 기본값과 Actions 적용값을 고정하고, Vercel 숫자 env는 배포 전 별도로 확인한다.
          COUPANG_SEARCH_OPERATING_CAP: '35'
          COUPANG_GLOBAL_MAX_PER_MIN: '80'
          COUPANG_INTERACTIVE_RESERVE_PER_MIN: '15'
          COUPANG_COLLECTOR_MAX_PER_MIN: '20'
          COUPANG_COLLECT_MIN_GAP_MS: '3000'
          COUPANG_RUN_BUDGET: '900'
          COUPANG_DAY_BUDGET: '3400'
          # ADPICK 상품 검색 공식 제한은 API 키 기준 분당 10회다. 2026-09-10
          # 운영에서 약 11회 호출 뒤 HTTP 429가 실측됐으므로 배치에는 다른 경로의
          # 여유를 남기기 위해 분당 최대 5회를 적용한다.
          # 12초 간격 + 모듈 자체 5회/분 상한의 이중 방어다.
          ADPICK_COLLECT_MIN_GAP_MS: '12000'
          ADPICK_MAX_PER_MIN: '5'
          # 모든 모드에 적용되는 ADPICK 하루 상한(코드 기본 740). 분당 속도는 위 5회 그대로다.
          # 근거: 공식 가이드는 검색 «분당 10회/키» 만 적고 일일 한도가 없다. 운영 실측
          #   09-18 하루 3,794회에서 429 10건은 전부 분당 초과였고 일일 차단은 없었다.
          #   09-24~26 429 0건, 수집기 외 ADPICK 사용은 하루 16~37회.
          # 5회/분으로 하루에 실제로 쓸 수 있는 양(작업 칸 × 50분)에 맞춘 값이다.
          # ── 1800 → 3000 (2026-09-29) ──
          # 09-29 대상 ADPICK 7,745개의 1차 검색어가 2,784종이라 1800 으로는 1차조차 끝나지
          # 않는다(그날 미호출 그룹 895종, 미시도 1,933개). 분당 속도(5회)는 그대로이고, 같은 날
          # 사용자가 돌린 캐치업이 3000 으로 외부 호출 2,271회를 쓰는 동안 429 는 0건이었다.
          # 공식 한도는 «분당 10회/키» 뿐이고 일일 한도는 문서에 없다.
          ADPICK_DAY_BUDGET: '3000'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          node scripts/collect-all-prices.js 2>&1 | tee /tmp/collect.log
          exit ${PIPESTATUS[0]}

      # 수집이 실패해도 알림 확인은 돌린다.
      # 오늘 수집분이 없으면 check-alerts.js 가 알아서 0건으로 끝나므로 해가 없고,
      # 부분적으로만 수집된 날에 알림이 통째로 빠지는 것을 막는다.
      - name: Check price alerts and send notifications
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node scripts/check-alerts.js

      - name: Coverage summary
        if: always()
        run: |
          echo "## Daily Price Collection Log" >> $GITHUB_STEP_SUMMARY
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/collect.log 2>/dev/null || echo "(로그 없음 — 수집 단계 도달 전 실패)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
