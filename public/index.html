/* ==================================================================
 *  SEOSA 디자인 토큰 — 「가격 원장(Ledger)」 (2026-08-30 전면 리디자인)

 *  ── 이 값들이 왜 이렇게 정해졌는가 ──────────────────────────
 *
 *  1) 표면은 순백(#FFFFFF)이다.
 *     쿠팡·제휴몰 상품 사진은 전부 흰 배경에 누끼로 온다. 예전 배경은

 *     떠 보였다 — 카드마다 흰 얼룩이 생기는 셈이다. 상품 사진이 콘텐츠의
 *     절반인 서비스에서 표면색은 취향이 아니라 사진에 맞추는 문제다.
 *
 *  2) 중성색을 웜에서 쿨-뉴트럴로 옮겼다.
 *     웜 그레이(#6E6E68)는 종이·서적의 색이다. 이 제품이 다루는 것은 종이가
 *     아니라 매일 갱신되는 관측 기록이다. 그리고 웜 페이퍼 + 웜 그레이 +
 *     세리프 + 넓은 자간 모노의 조합이 곧 특정 AI 제품의 브랜드 시스템이라,
 *     사용자가 "AI가 만든 사이트"로 읽고 클릭조차 하지 않았다(실제 피드백).
 *
 *  3) 색은 데이터의 것이다.
 *     화면에 상시로 존재하는 의미색은 하락(초록)·상승(빨강) 둘뿐이다.
 *     여기에 세 번째 채도 높은 브랜드색을 컨트롤에 뿌리면 "싸다/비싸다"
 *     신호가 묻힌다. 그래서 크롬(버튼·탭·필터)은 전부 무채색으로 두고,
 *     브랜드색(--brand, 황동)은 오직 「기록」 정체성 자리에만 쓴다.
 *     황동을 고른 이유는 원장·연감의 색이면서 초록/빨강과 충돌하지 않고,
 *     파랑·보라(AI 클리셰)도 아니기 때문이다.
 *
 *  4) radius 는 4px 이하다.
 *     예전 화면에는 border-radius >= 20px 인 요소가 122개 있었다.

 *     의미를 가진다 — 각진 면(4px)은 데이터, 완전한 원은 개수 배지뿐.
 *
 *  5) --sec-gap 120px -> 56px.
 *     예전에는 첫 상품 카드가 데스크톱 y=2043px 에 있었다(2.3화면).
 *     쇼핑 서비스에서 상품에 닿기까지 두 화면을 스크롤시키는 여백은
 *     "여유"가 아니라 장애물이다.
 * ================================================================== */
:root{
  /* 표면 */
  --bg:#FFFFFF;          /* 콘텐츠 표면 — 상품 사진 배경과 같은 값 */
  --page:#F4F5F7;        /* 구조용 밴드(기록 바·푸터·스켈레톤) */
  --surface:#F4F5F7; --surface-2:#E8EAEE;
  /*
   * 잉크.
   *
   * ★ --faint 는 #8B929D 였다 → 흰 배경에서 3.14:1, WCAG AA(4.5:1) 미달.
   *   측정해 보니 이 색이 28종 요소에 쓰이고 있었고 그중에는
   *     · .stamp / .as-of  관측일 (이 서비스의 표식이라고 해 놓고 가장 안 읽혔다)
   *     · .lprev           이전 기록가 (실제 가격 데이터)
   *     · 원장 열 머리 · .trust-why · .rb-note
   *   가 들어 있었다. "보조 정보라 흐리게"는 장식에나 쓰는 논리이고,
   *   여기 있는 것들은 전부 사용자가 읽어야 하는 사실이다.
   *   #68707A = 흰 배경 5.05:1 · 회색 밴드(--page) 4.55:1 로 둘 다 AA 통과.
   *   (#6E757F 는 흰 배경만 통과하고 푸터 회색 위에서 4.26:1 로 떨어졌다)
   */
  --ink:#15171B; --soft:#585E68; --faint:#68707A;
  /* 규칙선 — 이 디자인의 뼈대다. 카드가 아니라 선이 구조를 만든다. */
  --line:#E2E5E9; --line-2:#C7CCD3;
  /* 데이터 색 (의미색) */
  --down:#0A7A46; --down-bg:#E9F5EF;
  --up:#C0392B;   --up-bg:#FBECEA;
  /* 브랜드 — 「기록」 정체성 전용. 컨트롤에는 절대 쓰지 않는다. */
  --brand:#8A6D1C; --brand-bg:#FAF5E7;
  --naver:#03A95C; --coupang:#C81B25; --ali:#E0560C; --adpick:#3D6BE0;
  --card-bg:#fff;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  /*
   * --serif 는 값을 산세리프로 바꿔서 남겨 둔다.
   * 세리프 사용처는 전부 제거했지만, 캐시된 옛 마크업이나 놓친 참조가
   * 있어도 Times 로 떨어지지 않게 하기 위한 안전망이다.
   */
  --serif:var(--sans);
  --shadow:0 1px 2px rgba(21,23,27,.05);
  --shadow-lg:0 12px 32px -14px rgba(21,23,27,.24);
  --r:4px; --r-sm:3px; --r-lg:8px;
  /*
   * ── 여백 · 타이포 스케일 (2026-08-30 5차) ──────────────────────
   *
   * 4차까지의 값은 「정보를 빽빽하게 넣는다」쪽이었다. 실측 1280px 홈이
   * 5,783px 였고 섹션 간격 56px · 그리드 24px · 섹션 머리 18px 로,
   * 화면 어디를 봐도 쉬는 자리가 없었다.
   *
   * 여백은 장식이 아니라 **위계를 만드는 도구**다. 간격이 전부 비슷하면
   * 무엇이 무엇에 속하는지 눈이 못 나눈다. 그래서 세 단계로 벌린다.
   *
   *   --gap-sec   섹션과 섹션 사이   (가장 크게 — 여기서 화제가 바뀐다)
   *   --gap-blk   섹션 머리와 내용   (중간)
   *   --gap-item  항목과 항목 사이   (가장 작게)
   *
   * 타이포도 같은 이유로 벌린다. 섹션 제목 1.18rem 과 가격 1.32rem 은
   * 눈에 거의 같은 크기다 — 위계가 있다고 말만 하고 실제로는 없었다.
   */

  --t-display:2.05rem;   /* 화면의 주인공 (섹션 제목) */

  --sec-gap:var(--gap-sec);

/* .lact 는 5차에서 투명 텍스트가 됐다 — 다크에서 면을 다시 그리지 않는다. */
html[data-theme="dark"] .lact{color:var(--faint);border-color:transparent;background:none}
html[data-theme="dark"] .lact:hover{color:var(--ink);border-color:transparent}
html[data-theme="dark"] .card .thumb{background:var(--surface)}
html[data-theme="dark"] .badge{background:rgba(21,21,23,.94)}
/* .heart 는 5차에서 면을 없앴다 — 다크에서도 아이콘만 둔다. */
html[data-theme="dark"] .b-ai{background:#232327}
html[data-theme="dark"] .month-banner{background:#1C1C20}
/*
 * ★ .buy 와 .search-go 는 이 목록에서 뺐다 (2026-08-30 4차 감사).
 *
 *   이 규칙은 "라이트에서 검정으로 채운 버튼" 을 다크에서 뒤집어 주는
 *   목록이다. 그런데 2차 리디자인에서 두 개의 모양이 바뀌었다.
 *     · .buy       → 채운 블록에서 **밑줄 있는 텍스트**로
 *     · .search-go → 채운 버튼에서 **투명한 아이콘**으로
 *   목록은 그대로 남아서, 다크모드에서만 둘이 하얀 덩어리로 나왔다.
 *   특이성이 html[data-theme] + class = (0,2,1) 이라 뒤에 오는
 *   `.hsearch .search-go{background:transparent}` (0,2,0) 를 이겼다.
 *
 *   실측(375x812 다크): 헤더 검색 아이콘 배경 #EAEDF1 (흰 사각형),
 *   카드의 "구매하기"도 흰 블록. 라이트 화면과 서로 다른 물건처럼 보였다.
 *   두 요소는 이미 var(--ink)/var(--soft) 로 글자색을 쓰므로 목록에서
 *   빼면 다크에서 저절로 맞는다.
 */
/*
 * ★ .tbtn.dark 도 뺐다 (5차) — 위 .buy/.search-go 와 같은 이유다.
 *   5차에서 채운 검정 알약 → 밑줄 텍스트 링크로 바뀌었으므로, 이 목록에
 *   남아 있으면 다크에서만 다시 흰 덩어리가 된다. 같은 실수를 반복하지
 *   않으려면 **모양을 바꿀 때 이 목록도 같이 본다.**
 */
html[data-theme="dark"] .sort-btn.act,
html[data-theme="dark"] .filter-btn.act,
html[data-theme="dark"] .sync-btn.save,html[data-theme="dark"] .profile-save-btn,
html[data-theme="dark"] .alert-submit,html[data-theme="dark"] .chat-input button,
html[data-theme="dark"] .myalert-row button{background:var(--ink);color:#0E0E0F}
html[data-theme="dark"] .fab{background:var(--ink);color:#0E0E0F}
html[data-theme="dark"] .top-btn{background:var(--card-bg);color:var(--ink)}
html[data-theme="dark"] .toast{background:#2A2A2E;color:var(--ink)}
html[data-theme="dark"] .range-tabs button.act,
html[data-theme="dark"] .range-tabs button:hover{background:var(--ink);color:#0E0E0F}
html[data-theme="dark"] .wish-count{background:var(--ink);color:#0E0E0F}
html[data-theme="dark"] .hist-btn{background:rgba(240,240,238,.92);color:#0E0E0F}
html[data-theme="dark"] .ali-divider span{background:var(--bg)}
html[data-theme="dark"] .skel-thumb::after,html[data-theme="dark"] .skel-line::after{
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
/*
 * 다크 헤더.
 * ★ rgba(14,14,15,.82) 였다 — 예전에 헤더가 backdrop-filter:blur 를 쓰던
 *   시절의 값이다. 리디자인에서 blur 를 걷어냈으므로 반투명만 남아,
 *   스크롤할 때 상품 사진이 헤더 글자 뒤로 비쳐 읽기 어려웠다.
 *   라이트 헤더는 이미 불투명하다 — 다크도 맞춘다.
 */
html[data-theme="dark"] header{background:var(--bg)}
html[data-theme="dark"] ::selection{background:var(--ink);color:var(--bg)}
html[data-theme="dark"] .skel-card{background:var(--surface)}
html[data-theme="dark"] .cs-chip{background:var(--surface);border-color:var(--line);color:var(--soft)}
html[data-theme="dark"] .cmp-table{background:var(--card-bg)}
html[data-theme="dark"] .cmp-table tr.best{background:rgba(61,187,130,.08)}
html[data-theme="dark"] .modal,html[data-theme="dark"] .alert-box{background:var(--bg)}
html[data-theme="dark"] .sync-box,html[data-theme="dark"] .profile-footer,
html[data-theme="dark"] .chat-input,html[data-theme="dark"] .chat-suggest,html[data-theme="dark"] .chat-usage{background:var(--bg)}
html[data-theme="dark"] .verdict{background:var(--surface)}
html[data-theme="dark"] .stat{background:var(--surface)}
html[data-theme="dark"] .trend-summary{background:var(--surface)}

/* 테마 전환 부드럽게 */
body,.card,.ledger,header,footer,.panel,.wish-panel,.modal,.alert-box{
  transition:background-color .35s ease,color .35s ease,border-color .35s ease}

/* 테마 토글 버튼 */
/*
 * 테마 토글.
 * ★ 6차: 테두리 알약을 걷어냈다. 헤더에 남은 유일한 「상자」였는데,
 *   상자는 보통 "누르면 무슨 일이 생긴다"는 신호다. 그런데 이 버튼 옆의
 *   ♡ 와 ⋯ 는 상자 없이도 눌린다 — 같은 줄에서 하나만 상자를 두르면
 *   그것이 더 중요한 기능처럼 보인다. 셋 다 아이콘만 둔다.
 */
.theme-btn{background:none;border:0;border-radius:var(--r);
  width:34px;height:34px;cursor:pointer;color:var(--soft);font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;transition:.2s;padding:0;flex-shrink:0}
.theme-btn:hover{color:var(--ink);transform:rotate(-12deg)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
/*
 * line-height 1.7 -> 1.55.
 * 1.7 은 긴 산문을 읽는 값이다. 이 화면의 글은 상품명·가격·근거 한 줄처럼
 * 짧고 훑어보는 것이라, 넉넉한 행간이 오히려 한 덩어리로 안 묶이게 만든다.
 */
body{font-family:var(--sans);
  color:var(--ink);background:var(--bg);line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
@media(max-width:820px){.wrap{padding:0 16px}}
a{color:inherit;text-decoration:none}
/*
 * 배경이 var(--ink) 면 글자는 var(--bg) 여야 한다 — #fff 로 굳히면
 * 다크모드에서 --ink 가 밝은 색(#EAEDF1)으로 뒤집히면서 흰 글자가
 * 흰 배경에 얹힌다. 드래그해도 아무것도 안 보이는 상태가 된다.
 */
::selection{background:var(--ink);color:var(--bg)}
button{font-family:inherit}
/*
 * .num — 숫자가 표처럼 줄맞춤되게 한다.
 *
 * 예전에는 var(--mono)였다. 모노는 자릿수가 맞는 대신 "영수증·터미널"로
 * 읽히고, 한글 글리프가 없어서 "원" 같은 글자가 오면 조용히 다른 폰트로
 * 대체 렌더링됐다. 지금은 본문 폰트의 tabular 숫자를 쓴다 — 줄맞춤은
 * 그대로 얻으면서 가격이 돈으로 읽힌다.
 */
.num{font-variant-numeric:tabular-nums;letter-spacing:-.015em;font-feature-settings:'tnum' 1}
/*
 * 관측일 스탬프 — 이 서비스만의 요소.
 * 다른 쇼핑몰은 "이 가격을 언제 확인했는지"를 보여주지 않는다.
 * 모노를 여기 한 곳에만 남겨 원장이라는 정체성을 형태로 드러낸다.
 */
.stamp{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;
  color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 헤더 ────────────────────────────────────────────────────────
 *
 * ★ 무엇이 primary 인가: 검색이다.
 *
 * 예전 구조는 [로고] ————— [메뉴 5개] 였고 검색은 히어로 한가운데
 * 620px 짜리 검정 버튼 달린 상자였다. 그래서 "검색 버튼이 너무 앞쪽에
 * 나와 있다"는 피드백이 나왔다 — 문제는 위치가 아니라, 홈에서 검색이
 * 화면 전체를 대표하는 오브제였다는 것이다.
 *
 * 검색을 헤더로 옮기면 두 가지가 동시에 해결된다.
 *   · 발견성은 오히려 올라간다 (모든 화면에 상주한다)
 *   · 시각 지배는 사라진다 (헤더 안의 한 요소일 뿐이다)
 * 그리고 히어로가 비워져서 상품이 폴드 안으로 올라온다.
 *
 * blur 를 걷어냈다. 배경 흐림은 이 화면에서 아무 정보도 전달하지 않으면서
 * 스크롤 중 상품 사진 위에 뿌연 띠를 만든다. 불투명 + 하단 규칙선이 낫다.
 */
header{position:sticky;top:0;z-index:200;background:var(--bg);
  border-bottom:1px solid var(--line);transition:box-shadow .2s}
header.solid{box-shadow:0 1px 0 var(--line),0 6px 16px -14px rgba(21,23,27,.35)}
/* position:relative — .nav-menu(오버플로 메뉴)가 이 박스를 기준으로 내려온다. */
/*
 * 검색칸이 화면 정중앙에 오도록 좌/우를 같은 폭(1fr)으로 잡는다.
 * flex 로 두면 좌우 내용 길이가 달라 검색칸이 늘 한쪽으로 밀린다.
 */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:20px;height:66px;position:relative}
/*
 * 로고 — 세리프를 뺀다. 자간을 넓힌 산세리프 대문자로 두어
 * "브랜드 워드마크"의 성격은 남기되 에디토리얼 잡지 느낌을 없앤다.
 * 태그라인(small)은 헤더에서 뺐다 — 높이만 먹고 아무도 읽지 않는다.
 */
.logo{font-weight:800;font-size:1.02rem;letter-spacing:.2em;
  cursor:pointer;line-height:1;transition:opacity .15s;flex:0 0 auto;
  display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo:hover{opacity:.6}
.logo small{display:none}
/*
 * ★ 워드마크를 접고 S 심볼만 둔다.
 *
 *   심볼은 /favicon.svg 의 글리프 그대로다(Georgia serif · 700 · ls 1).
 *   색은 fill="currentColor" 로 .logo 의 color(--ink)를 상속하므로
 *     라이트 --ink #15171B → 검은 S
 *     다크   --ink #EAEDF1 → 흰 S
 *   가 자동으로 된다. 금색(--brand)을 쓰던 것을 되돌린 것이다.
 */
.logo .logo-word{display:none}
/*
 * S 심볼 — /favicon.svg 의 글리프를 그대로 쓴다(마크업 주석 참고).
 * fill:currentColor 이므로 .logo 의 color(--ink)를 상속한다:
 *   라이트 --ink #15171B → 검은 S      다크 --ink #EAEDF1 → 흰 S
 *
 * ★ 규칙이 두 벌(21px / 34px) 있어서 뒤의 21px 이 이기고 있었다. 하나로 합친다.
 */
.logo-mark{width:34px;height:34px;flex:0 0 auto;display:block}

/* 헤더 검색 — 남는 가로 공간을 전부 가져간다(= 이 화면의 primary). */
/*
 * ── 5차: 검색창을 조용하게, 그러나 더 넓게 ────────────────────
 *
 * 지시 4 — 「쉽게 찾고 바로 쓰되 화면을 압도하지 않게」.
 * 4차까지 검색칸은 회색으로 **채워진** 상자였다. 헤더에서 유일하게
 * 색이 있는 면이라 눈에는 잘 띄었지만, 스크롤 내내 회색 덩어리가
 * 따라다녔다.
 *
 * 채움을 빼고 테두리 한 겹만 남긴다.
 *
 * ── 6차: 620px → 420px ────────────────────────────────────────
 * 5차는 「자리」로 눈에 띄게 하려고 최대 폭을 620px 까지 늘렸다. 실측하니
 * 1440px 화면에서 검색칸 하나가 가로의 43% 였다 — 헤더에서 가장 큰 물건이
 * 검색칸이 되면 헤더가 화면의 주인공이 된다. 헤더는 조용해야 한다.
 *
 * 420px 는 한국어 상품명 질의(평균 12~18자)를 자르지 않고 담는다.
 * 눈에 띄는 일은 자리가 아니라 **위치**(헤더 가운데)와 포커스 상태가 맡는다.
 */
/*
 * ── 목업 기준 헤더 검색 ───────────────────────────────────────
 * 채운 회색 알약. 헤더 가운데에 놓이고(.bar 가 좌/우를 1fr 로 잡는다)
 * 최대 폭 550px. 포커스가 들어오면 면이 흰색으로 올라오고 테두리가 진해진다.
 */
.hsearch{flex:1 1 auto;min-width:0;max-width:550px;position:relative;justify-self:center;width:100%}
.hsearch .search-field{display:flex;align-items:center;gap:8px;
  border:1px solid transparent;background:var(--surface);
  border-radius:26px;padding:0 8px 0 20px;height:44px;
  transition:border-color .2s var(--ease),background .2s var(--ease)}
.hsearch .search-field:hover{border-color:var(--line)}
.hsearch .search-field:focus-within{border-color:var(--line-2);background:var(--bg)}
.hsearch .search-field input{flex:1;border:0;background:transparent;outline:0;min-width:0;
  font-family:inherit;font-size:.86rem;color:var(--ink);height:100%}
.hsearch .search-field input::placeholder{color:var(--faint)}
/*
 * 검색 실행 버튼: 채운 검정 알약 -> 아이콘 크기의 조용한 버튼.
 * 입력창 자체가 이미 "여기에 검색한다"는 affordance 다. Enter 로도 되고,
 * 이 버튼은 그것을 눌러서 하고 싶은 사람을 위한 보조 경로다.
 */
.hsearch .search-go{border:0;background:transparent;color:var(--soft);
  border-radius:50%;width:34px;height:34px;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;flex:0 0 auto}
.hsearch .search-go svg{width:19px;height:19px;display:block}
.hsearch .search-go:hover{background:var(--surface-2);color:var(--ink)}
.hsearch .autocomplete{left:0;right:0;top:calc(100% + 6px)}

.nav-right{display:flex;align-items:center;gap:14px;flex:0 0 auto;margin-left:auto}
.nav-link{font-size:.84rem;color:var(--soft);cursor:pointer;transition:color .15s;font-weight:500;
  white-space:nowrap;margin-right:4px}
.nav-link:hover{color:var(--ink)}
/* 헤더 오른쪽 라인 아이콘 3종 (♡ · 사람 · ☰) — 목업과 같은 무게로 맞춘다. */
.nav-ico{width:21px;height:21px;display:block}
.icon-btn{background:none;border:0;padding:0;cursor:pointer;color:var(--soft);
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;transition:color .15s,background .15s}
.icon-btn:hover{color:var(--ink);background:var(--surface)}
.wish-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--soft);
  transition:color .15s,background .15s}
.wish-btn:hover{color:var(--ink);background:var(--surface)}
/*
 * 개수 배지.
 *
 * ★ 6차: 채운 검정 원 → 숫자만.
 *   예전에는 background:var(--ink) 인 완전한 원이었다. 그 결과 헤더에서
 *   가장 진한 덩어리가 **위시리스트 개수**였다 — 5차에서 .tbtn.dark 를
 *   텍스트 링크로 내린 것과 정확히 같은 위계 역전이다. 브랜드도 검색도
 *   아닌 부가 기능이 헤더에서 제일 무거우면 안 된다.
 *   숫자는 ♡ 옆에 붙어 있다는 것만으로 이미 "위시 개수"로 읽힌다.
 *   (0 일 때는 Wish.updateCount 가 hidden 으로 감춘다)
 */
/* 아이콘 오른쪽 위에 붙는 작은 개수 배지 (0 이면 감춘다). */
.wish-count{position:absolute;top:0;right:0;min-width:16px;height:16px;padding:0 4px;
  border-radius:16px;background:var(--ink);color:var(--bg);
  font-size:.6rem;font-weight:700;line-height:16px;text-align:center;
  transition:transform .3s;font-variant-numeric:tabular-nums;display:inline-block}
/* display 를 명시했으므로 [hidden] 기본값(display:none)이 진다 — 되돌린다. */
.wish-count[hidden]{display:none}
.wish-count.pulse{transform:scale(1.4)}
@media(max-width:900px){.nav-link.hide-m{display:none}}
@media(max-width:640px){
  .bar{height:54px;gap:10px}
  .logo{font-size:.92rem;letter-spacing:.16em}
  .hsearch{max-width:none}
  .nav-right{gap:8px}
  /*
   * 좁은 화면에서는 워드마크를 접고 S 심볼만 남긴다.
   *
   * 헤더 한 줄에 로고·검색·컨트롤 셋이 같이 서는데, 모바일에서 가장
   * 쓰이는 것은 검색이다. 워드마크("SEOSA" 6글자 + 자간)가 약 75px 를
   * 가져가면 검색칸이 144px 까지 눌려 상품명 두어 글자밖에 안 보인다.
   * 심볼 하나로도 브랜드는 읽히고(favicon 과 같은 글자다), 검색칸은
   * 그만큼 넓어진다. 데스크톱에서는 워드마크가 그대로 나온다.

 * 붙이지 않으면 탭으로 도달은 되는데 실행이 안 되는, 더 나쁜 상태가 된다.

function bindInputs() {

  // 검색창
  var q = $('q');
  if (q) {
    q.addEventListener('input', function() {
      var v = this.value.trim().toLowerCase();
      Auto.render(v);
    });

    // 포커스하면 인기 검색어 먼저 보여주기
    q.addEventListener('focus', function() {
      // 검색을 "시작"한 순간. 세션당 한 번만 센다 — 포커스는 오갈 때마다 발생한다.
      Track.evOnce('search_open');
      var v = this.value.trim().toLowerCase();
      Auto.render(v);
    });

    q.addEventListener('keydown', function(e) {
      var box = Auto.box();
      var open = box && box.classList.contains('open');

      if (e.key === 'Enter') {
        if (open && AppState.acIndex >= 0) {
          e.preventDefault();
          Auto.pick(Auto.items()[AppState.acIndex]);
        } else {
          Search.run();
        }
        return;
      }
      if (!open) return;

      if (e.key === 'ArrowDown')      { e.preventDefault(); Auto.move(1); }
      else if (e.key === 'ArrowUp')   { e.preventDefault(); Auto.move(-1); }
      else if (e.key === 'Escape')    { Auto.close(); }
    });

    q.addEventListener('blur', function() { setTimeout(Auto.close, 200); });
  }

  /*
   * 가격 입력창.
   * Enter 로도 적용된다 — 모바일에서는 "적용" 버튼까지 손가락을 옮기는 것보다
   * 키패드의 확인을 누르는 쪽이 자연스럽다.
   */
  ['fMin', 'fMax'].forEach(function(id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); Search.applyPriceInputs(); }
    });
    // 포커스를 잃으면 자동 적용. 버튼을 못 찾아 헤매지 않게 한다.
    el.addEventListener('blur', function() { setTimeout(Search.applyPriceInputs, 120); });
  });

  // 챗 입력
  var chatInput = $('chatInput');
  if (chatInput) {
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') Chat.send();
    });
  }

  // 알림 목표가 미리보기
  var atp = $('alertTargetPrice');
  if (atp) atp.addEventListener('input', function() { Alert.updatePreview(this.value); });

  // 내 알림 이메일 엔터
  var mae = $('myAlertsEmail');
  if (mae) {
    mae.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') MyAlerts.load();
    });
  }

  // 인증 창 — 이메일/코드 어디서든 엔터로 진행
  ['authEmail', 'authCode'].forEach(function(id) {
    var el = $(id);
    if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter') Auth.submit(); });
  });
}

var Shelf = {
  NS: 'http://www.w3.org/2000/svg',
  LIFT: 12,          /* .bs-book:hover 의 translateY 와 같은 값(유저유닛) */
  svg: null, art: null, tip: null,

  init: function() {
    var svg = document.querySelector('.hero-still');
    if (!svg || !svg.viewBox || !svg.viewBox.baseVal) return;

    var linked = 0;
    Array.prototype.forEach.call(svg.querySelectorAll('g[data-bs]'), function(g) {
      var idx  = Number(g.getAttribute('data-bs'));
      var book = SHELF_BOOKS[idx];
      var url  = book ? Fmt.safeUrl(book.coupangUrl) : '';
      if (!url) return;                       // 링크 없는 책은 그림 그대로 둔다

      /*
       * <a> 로 «감싼다» — <g> 에 직접 걸지 않는다. 6권은 <g> 에
       * transform="rotate(...)" 속성으로 기울어 있는데, 같은 요소에 CSS
       * transform 이 붙으면 그 속성이 덮여 기울기가 펴진다.
       */
      var a = document.createElementNS(Shelf.NS, 'a');
      a.setAttribute('class', 'bs-book');
      a.setAttribute('href', url);
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer sponsored nofollow');
      a.setAttribute('tabindex', '0');
      a.setAttribute('aria-label', book.title + ' 쿠팡에서 보기');
      a.setAttribute('data-affiliate', '');
      a.setAttribute('data-bs', String(idx));
      g.parentNode.insertBefore(a, g);
      a.appendChild(g);
      linked++;
    });

    if (!linked) return;                      // 링크가 하나도 없으면 예전 그대로다

    /*
     * 이 SVG 는 여태 장식이었다(aria-hidden="true"). 이제 그 안에 링크가
     * 생겼으니 감춰 둘 수 없다 — 감춘 채로 두면 스크린리더에는 없는데
     * Tab 으로는 들어가지는 자리가 된다. 대신 책 <g> 하나하나에
     * aria-hidden 을 걸어 두었으므로(HTML 참조), 읽히는 것은 <a> 의
     * aria-label 뿐이고 «코 스 모 스» 같은 낱자 낭독은 일어나지 않는다.
     */
    svg.removeAttribute('aria-hidden');
    svg.removeAttribute('focusable');

    Shelf.svg = svg;
    Shelf.art = svg.closest('.hero-art');
    Shelf.tip = $('bsTip');

    Array.prototype.forEach.call(svg.querySelectorAll('a.bs-book'), function(a) {
      a.addEventListener('mouseenter', function() { Shelf.show(a); });
      a.addEventListener('mouseleave', Shelf.hide);
      a.addEventListener('focus',  function() {
        // 키보드로 들어온 때만 이름표를 띄운다 — 마우스 클릭 뒤에는 뜨지 않는다.
        var vis = true;
        try { vis = a.matches(':focus-visible'); } catch (e) {}
        if (vis) Shelf.show(a);
      });
      a.addEventListener('blur', Shelf.hide);
      a.addEventListener('click', function() {
        /*
         * 새 탭은 <a target="_blank"> 가 «직접» 연다. 여기서 가로채
         * 중계 페이지로 보내지 않는다 — 리다이렉트를 한 번 끼우면 쿠팡이
         * 클릭을 어느 링크에서 왔는지 잃을 수 있고, 그건 수익 귀속을

         *                         여기에만 «어느 책이 눌렸는가» 가 남는다.
         * 가격은 보내지 않는다. 여기 박아 둔 값은 오늘 가격이고 내일이면
         * 사실이 아니다 — funnel 은 «관측된 값» 만 받는다.
         */
        Track.ev('external_shop_click');
        var bk = SHELF_BOOKS[Number(a.getAttribute('data-bs'))] || {};
        var qs = 'event=affiliate_click&src=hero_book&mall=' + encodeURIComponent('쿠팡');
        if (bk.productId) qs += '&pid=' + encodeURIComponent(bk.productId);
        try { qs += '&vid=' + encodeURIComponent(Track.vid()); } catch (e) {}
        Track.ping(qs);
      });
    });
  },

  /**
   * 책 한 권의 «가만히 있을 때» 화면 좌표.
   *
   * getBoundingClientRect 를 쓰면 hover transform 이 섞여 들어와, 라벨이
   * 애니메이션 중간값 자리에 붙는다. viewBox 좌표(getBBox)는 그 변형과
   * 무관하므로 이쪽을 쓰고 배율만 곱한다. width:100%/height:auto 라
   * 레터박스가 없어서 가로세로 배율이 같다.
   */
  rect: function(el) {
    var sr = Shelf.svg.getBoundingClientRect(), bb;
    if (!sr.width) return null;
    try { bb = el.getBBox(); } catch (e) { return null; }
    var k = sr.width / Shelf.svg.viewBox.baseVal.width;
    return { x: sr.left + bb.x * k, y: sr.top + bb.y * k,
             w: bb.width * k, h: bb.height * k };
  },

  show: function(a) {
    var tip = Shelf.tip, art = Shelf.art;
    if (!tip || !art) return;
    var book = SHELF_BOOKS[Number(a.getAttribute('data-bs'))];
    if (!book) return;

    tip.innerHTML = '<span class="bs-tip-t">' + Fmt.esc(book.title) + '</span>'
      + (book.author ? '<span class="bs-tip-a">' + Fmt.esc(book.author) + '</span>' : '')
      + '<span class="bs-tip-c">쿠팡에서 보기 →</span>';
    tip.classList.add('on');                  // 크기를 재려면 먼저 그려져 있어야 한다

    var r = Shelf.rect(a);
    if (!r) return;
    var ar = art.getBoundingClientRect();

    /*
     * 가로는 책 가운데, 세로는 책 «발밑» 이다. 그리고 둘 다 .hero-art 안으로
     * 가둔다 — .hero-band 가 overflow:hidden 이라 밖으로 나가면 잘린다.
     */
    var half = tip.offsetWidth / 2;
    var x = r.x - ar.left + r.w / 2;
    if (ar.width > tip.offsetWidth) x = Math.max(half + 2, Math.min(ar.width - half - 2, x));

    var y = r.y - ar.top + r.h + 10;
    y = Math.min(y, ar.height - tip.offsetHeight - 2);

    tip.style.left = x + 'px';
    tip.style.top  = Math.max(2, y) + 'px';
  },

  hide: function() {
    if (Shelf.tip) Shelf.tip.classList.remove('on');
  }
};

       * 검색어는 그대로고 필터·정렬만 달라진 경우 (필터를 걸었다가 뒤로 간 경우).
       * 다시 검색할 이유가 없다 — 이미 손에 있는 결과를 다시 거르기만 하면 된다.
       * Search.run 을 부르면 화면이 스켈레톤으로 한 번 비워졌다가 돌아와서,
       * 뒤로 가기가 새 페이지 로딩처럼 느껴진다.
       */
      if (kw === AppState.lastKeyword && AppState.results.length) {
        Search.readFacetsFromUrl();
        $$('.sort-btn').forEach(function(b) { b.classList.toggle('act', b.dataset.sort === AppState.sort); });
        $$('.filter-btn').forEach(function(b) { b.classList.toggle('act', b.dataset.mall === AppState.facets.mall); });
        Search.applyView({ fromUrl: true });
        return;
      }

      Search.run(kw, { fromUrl: true });
    });
  }
};

/**
 * 정책/안내 모달 관리
 */
/* ==================================================================
 *  히어로 캐러셀 (2026-09-16)
 *
 *  문구는 하나도 여기 없다. DOM 의 .hc-slide 를 순서대로 읽어 넘길 뿐이라
 *  배너를 추가·수정할 때 이 파일의 JS 는 건드리지 않는다(HTML 주석 참고).
 *
 *  ── 겹쳐 쌓기 전환 ────────────────────────────────────────────────
 *  네 장이 같은 grid 칸(1/1)에 겹쳐 있다. 넘길 때 나가는 장은 진행 방향의
 *  반대쪽으로, 들어오는 장은 진행 방향 쪽에서 들어온다. 들어오는 장을 먼저
 *  «애니메이션 없이» 바깥에 세워 두고(reflow 한 번) 그다음에 0 으로 민다 —
 *  이 두 단계를 나누지 않으면 브라우저가 시작 위치를 보지 못해 그냥 나타난다.
 *
 *  마지막 → 첫 장도 이 규칙을 그대로 타므로 복제 노드 없이 무한히 돈다.
 *
 *  ── 자동 넘김을 멈추는 경우 ──────────────────────────────────────
 *    · 마우스가 배너 위에 있을 때          (hover)
 *    · 키보드 포커스가 배너 안에 있을 때   (focusin)
 *    · 탭이 백그라운드일 때                (visibilitychange)
 *    · 배너가 화면 밖으로 나갔을 때        (IntersectionObserver)
 *    · 손가락이 배너에 닿아 있는 동안      (pointerdown)
 *    · 애니메이션 최소화를 요청한 사용자   (prefers-reduced-motion)
 *  사용자가 직접 넘기면 타이머를 리셋한다 — 방금 본 장이 곧바로 사라지지 않게.
 * ================================================================== */
var HeroCarousel = {
  root: null, slides: [], dots: [], live: null,
  cur: 0, timer: 0, interval: 5500,
  paused: { hover: false, focus: false, hidden: false, out: false, touch: false },
  reduced: false,

  init: function() {
    var root = $('heroCarousel');
    if (!root) return;
    var view = $('hcViewport');
    this.root = root;
    this.slides = view ? [].slice.call(view.querySelectorAll('.hc-slide')) : [];
    if (this.slides.length < 2) {
      // 슬라이드가 하나뿐이면 캐러셀이 아니다 — 컨트롤을 숨기고 그대로 둔다.
      if (this.slides[0]) this.slides[0].classList.add('on');
      ['hcPrev', 'hcNext', 'hcDots'].forEach(function(id) {
        var el = $(id); if (el) el.style.display = 'none';
      });
      return;
    }
    this.live = $('hcLive');
    this.interval = Math.max(2500, parseInt(root.dataset.interval, 10) || 5500);
    try {
      this.reduced = window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { this.reduced = false; }

    this.buildDots();
    // 첫 장은 애니메이션 없이 제자리에 둔다(초기 표시 지연 없음).
    var self = this;
    this.slides.forEach(function(s, i) { self.place(s, i === 0 ? 0 : 1, false); });
    this.cur = 0;
    this.sync();
    this.bind();
    root.classList.add('ready');   // 화살표는 배선이 끝난 뒤에 보인다
    this.play();
  },

  buildDots: function() {
    var box = $('hcDots');
    if (!box) return;
    var self = this;
    this.dots = this.slides.map(function(s, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'hc-dot';
      var label = s.dataset.label || (i + 1) + '번';
      b.setAttribute('aria-label', (i + 1) + '번 배너 · ' + label);
      b.addEventListener('click', function() { self.user(i); });
      box.appendChild(b);
      return b;
    });
  },

  /* pos: -1 왼쪽 밖 · 0 제자리 · 1 오른쪽 밖 */
  place: function(el, pos, animate) {
    if (!animate) el.style.transition = 'none';
    el.style.transform = 'translateX(' + (pos * 100) + '%)';
    el.style.opacity = pos === 0 ? '1' : '0';
    el.classList.toggle('on', pos === 0);
    /*
     * 보이지 않는 장은 스크린리더에서도 없는 것으로 친다. 이게 없으면
     * 네 장이 한꺼번에 읽혀 어디를 듣고 있는지 알 수 없다.
     * (visibility:hidden 이라 탭 순서에서는 CSS 가 이미 빼 준다)
     */
    el.setAttribute('aria-hidden', pos === 0 ? 'false' : 'true');
    if (!animate) {
      void el.offsetWidth;          // 시작 위치를 브라우저에 확정시킨다
      el.style.transition = '';
    }
  },

  go: function(next, dir) {
    var n = this.slides.length;
    if (!n) return;
    next = ((next % n) + n) % n;    // 무한 loop — 음수도 감싼다
    if (next === this.cur) return;
    var from = this.slides[this.cur], to = this.slides[next];
    this.place(to, dir > 0 ? 1 : -1, false);   // 들어올 쪽에 세워 두고
    this.place(from, dir > 0 ? -1 : 1, true);  // 나가는 장을 민다
    this.place(to, 0, true);                   // 들어오는 장을 제자리로
    this.cur = next;
    this.sync();
  },

  sync: function() {
    var self = this;
    this.dots.forEach(function(d, i) {
      if (i === self.cur) d.setAttribute('aria-current', 'true');
      else d.removeAttribute('aria-current');
    });
    if (this.live) {
      var s = this.slides[this.cur];
      this.live.textContent = '배너 ' + (this.cur + 1) + ' / ' + this.slides.length
        + (s && s.dataset.label ? ' · ' + s.dataset.label : '');
    }
  },

  next: function() { this.go(this.cur + 1, 1); },
  prev: function() { this.go(this.cur - 1, -1); },

  /** 사용자가 직접 넘긴 경우 — 타이머를 처음부터 다시 센다. */
  user: function(i) {
    var dir = i === this.cur ? 1 : (i > this.cur ? 1 : -1);
    // 끝에서 끝으로 건너뛸 때도 «가까운 쪽» 방향으로 움직이게 한다.
    if (Math.abs(i - this.cur) > this.slides.length / 2) dir = -dir;
    this.go(i, dir);
    this.play();
  },

  play: function() {
    clearInterval(this.timer);
    this.timer = 0;
    if (this.reduced) return;       // 애니메이션 최소화 요청 — 자동 넘김 없음
    var p = this.paused;
    if (p.hover || p.focus || p.hidden || p.out || p.touch) return;
    var self = this;
    this.timer = setInterval(function() { self.next(); }, this.interval);
  },

  pause: function(key, on) {
    if (this.paused[key] === on) return;
    this.paused[key] = on;
    this.play();
  },

  bind: function() {
    var self = this, root = this.root;
    var prev = $('hcPrev'), next = $('hcNext');
    if (prev) prev.addEventListener('click', function() { self.prev(); self.play(); });
    if (next) next.addEventListener('click', function() { self.next(); self.play(); });

    root.addEventListener('mouseenter', function() { self.pause('hover', true); });
    root.addEventListener('mouseleave', function() { self.pause('hover', false); });
    root.addEventListener('focusin',  function() { self.pause('focus', true); });
    root.addEventListener('focusout', function(e) {
      if (!root.contains(e.relatedTarget)) self.pause('focus', false);
    });

    document.addEventListener('visibilitychange', function() {
      self.pause('hidden', document.hidden);
    });

    // 화면 밖으로 나간 배너를 계속 넘기는 것은 그냥 낭비다.
    if (window.IntersectionObserver) {
      new IntersectionObserver(function(entries) {
        entries.forEach(function(en) { self.pause('out', !en.isIntersecting); });
      }, { threshold: 0.2 }).observe(root);
    }

    /*
     * 키보드 — 좌우 화살표로 넘긴다. 입력 중인 칸에서는 가로채지 않는다.
     * 버튼(화살표·점)의 Enter/Space 는 <button> 이라 브라우저가 처리한다.
     */
    root.addEventListener('keydown', function(e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); self.next(); self.play(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); self.prev(); self.play(); }
    });

    this.bindSwipe();
  },

  /*
   * 모바일 스와이프.
   *
   * CSS 의 touch-action:pan-y 가 세로 스크롤을 브라우저에 맡기므로 여기서는
   * 가로 제스처만 본다. preventDefault 를 부르지 않는다 — 페이지 좌우 스크롤이
   * 생기지 않게 하는 것은 .hc-viewport 의 overflow:hidden 과 touch-action 이다.
   */
  bindSwipe: function() {
    var self = this, view = $('hcViewport');
    if (!view || !window.PointerEvent) return;
    var x0 = 0, y0 = 0, id = null, live = false;
    view.addEventListener('pointerdown', function(e) {
      if (e.pointerType === 'mouse') return;   // 마우스 드래그는 스와이프가 아니다
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; live = true;
      self.pause('touch', true);
    });
    var end = function(e) {
      if (!live || e.pointerId !== id) return;
      live = false;
      var dx = e.clientX - x0, dy = e.clientY - y0;
      // 가로 이동이 세로보다 확실히 클 때만 넘긴다(세로 스크롤 오인 방지).
      if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) self.next(); else self.prev();
      }
      self.pause('touch', false);
      self.play();
    };
    view.addEventListener('pointerup', end);
    view.addEventListener('pointercancel', function(e) {
      if (!live || e.pointerId !== id) return;
      live = false; self.pause('touch', false); self.play();
    });
  }
};

var Policy = {
  openPrivacy: function() {
    var o = $('privacyOverlay');
    if (o) o.style.display = 'flex';
  },
  closePrivacy: function() {
    var o = $('privacyOverlay');
    if (o) o.style.display = 'none';
  },
  openTerms: function() {
    var o = $('termsOverlay');
    if (o) o.style.display = 'flex';
  },
  closeTerms: function() {
    var o = $('termsOverlay');
    if (o) o.style.display = 'none';
  },

  openBusiness: function() {
    var o = $('businessOverlay');
    if (o) o.style.display = 'flex';
  },
  closeBusiness: function() {
    var o = $('businessOverlay');
    if (o) o.style.display = 'none';
  },

  /*
   * 참전용사 지원 — 히어로 4번 슬라이드의 「취지 보기」.
   *
   * ★ display 만 바꾸지 않고 .open 도 함께 준다. .overlay 는 기본값이
   *   opacity:0 · visibility:hidden 이고 보이게 하는 것은 .open 이다.
   *   display:flex 한 줄만으로는 화면에 아무것도 나타나지 않는다.
   */
  openVeteran: function() {
    var o = $('veteranOverlay');
    if (!o) return;
    o.style.display = 'flex';
    void o.offsetWidth;            // 전환이 보이도록 한 프레임 확정
    o.classList.add('open');
    var c = o.querySelector('.modal-close');
    if (c) c.focus();
  },
  closeVeteran: function() {
    var o = $('veteranOverlay');
    if (!o) return;
    o.classList.remove('open');
    setTimeout(function() { if (!o.classList.contains('open')) o.style.display = 'none'; }, 300);
  }
};

// 정책 모달 닫기 버튼 바인딩
document.addEventListener('click', function(e) {
  if (e.target.dataset.act === 'close-privacy') Policy.closePrivacy();
  if (e.target.dataset.act === 'close-terms') Policy.closeTerms();
  if (e.target.dataset.act === 'close-business') Policy.closeBusiness();
  // 오버레이 클릭으로 닫기
  if (e.target.id === 'privacyOverlay') Policy.closePrivacy();
  if (e.target.id === 'termsOverlay') Policy.closeTerms();
  if (e.target.id === 'businessOverlay') Policy.closeBusiness();
}, true);

Init.run();
</script>
