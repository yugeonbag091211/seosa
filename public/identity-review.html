<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>상품 식별 검토 · SEOSA</title>
  <style>
    :root{color-scheme:light;--ink:#18212f;--muted:#697586;--line:#dce2ea;--bg:#f5f7fa;--card:#fff;--blue:#175cd3;--red:#b42318;--amber:#b54708;--green:#067647}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1240px;margin:0 auto;padding:28px 20px 72px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--muted);margin:5px 0 22px}.layout{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:18px}.panel,.item,.member{background:var(--card);border:1px solid var(--line);border-radius:12px}.panel{padding:16px}.queue{display:grid;gap:8px}.queue button{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:9px;padding:11px;cursor:pointer;color:inherit}.queue button:hover,.queue button.selected{border-color:var(--blue);box-shadow:0 0 0 2px #175cd31a}.queue-title{font-weight:650;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:3px}.pill{display:inline-block;border-radius:99px;padding:2px 8px;background:#eff4ff;color:#1849a9;font-size:12px;font-weight:650;margin-right:5px}.pill.high{background:#ecfdf3;color:var(--green)}.pill.medium{background:#fffaeb;color:var(--amber)}.pill.low{background:#f2f4f7;color:#475467}.hidden{display:none!important}.empty{color:var(--muted);padding:20px 5px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.reason{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}.reason code{background:#f2f4f7;padding:3px 7px;border-radius:6px;font-size:12px}.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0}.member{padding:13px;min-width:0}.member h3{margin:0 0 6px;font-size:14px}.title{font-weight:650;overflow-wrap:anywhere;margin:7px 0}.price{font-size:18px;font-weight:700}.attrs{font-size:13px;color:#344054;overflow-wrap:anywhere}.compare{width:100%;border-collapse:collapse;margin:14px 0 20px;background:white;border-radius:9px;overflow:hidden}.compare th,.compare td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.compare th{background:#f8fafc}.state-same{color:var(--green)}.state-missing,.state-unknown{color:var(--amber)}.state-conflict{color:var(--red);font-weight:700}.warning{background:#fef3f2;color:var(--red);border:1px solid #fecdca;padding:12px;border-radius:9px;margin:12px 0}.notice{background:#fffaeb;color:#93370d;border:1px solid #fedf89;padding:11px;border-radius:9px;margin:12px 0}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:end;margin-top:18px}.controls label{display:grid;gap:4px;font-size:13px;color:#475467}select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:8px;background:white;color:var(--ink)}textarea{width:100%;min-height:74px;resize:vertical}.buttons{display:flex;gap:8px;margin-top:10px}.buttons button,.reload{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:650;cursor:pointer}.reload{background:#eef4ff;color:#1849a9}.approve{background:var(--blue);color:white}.reject{background:#b42318;color:white}.defer{background:#f2f4f7;color:#344054}.buttons button:disabled{opacity:.45;cursor:not-allowed}.error{color:var(--red);white-space:pre-wrap}.signed{font-size:12px;color:var(--muted)}@media(max-width:780px){main{padding:20px 12px}.layout{grid-template-columns:1fr}.queue{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
  </style>
</head>
<body>
<main>
  <header class="row"><div><h1>상품 식별 검토</h1><p class="sub">Phase 4 관리자 검토 · 승인해도 고객 검색·가격비교에는 연결되지 않습니다.</p></div><button class="reload" id="reload">새로고침</button></header>
  <p id="status" class="notice">관리자 인증을 확인하고 있습니다.</p>
  <div id="app" class="layout hidden">
    <section class="panel"><div class="row"><h2>검토 대기열</h2><span id="signed" class="signed"></span></div><div id="queue" class="queue"></div></section>
    <section id="detail" class="panel"><div class="empty">검토할 항목을 선택하세요.</div></section>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const status = $('status'), app = $('app'), queue = $('queue'), detail = $('detail');
  let token = '', selected = null, currentDetail = null;
  function savedToken() {
    try { const v = JSON.parse(localStorage.getItem('seosa_token') || 'null'); return v && typeof v.token === 'string' ? v.token : ''; }
    catch (_) { return ''; }
  }
  async function request(url, options) {
    const response = await fetch(url, Object.assign({ headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, cache: 'no-store' }, options || {}));
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || `요청 실패 (${response.status})`);
    return body;
  }
  function text(tag, value, className) { const el = document.createElement(tag); el.textContent = value == null ? '' : String(value); if (className) el.className = className; return el; }
  function renderQueue(items) {
    queue.replaceChildren();
    if (!items.length) { queue.append(text('div', '현재 검토할 항목이 없습니다.', 'empty')); return; }
    for (const item of items) {
      const button = document.createElement('button'); if (String(item.id) === String(selected)) button.classList.add('selected');
      const head = document.createElement('div'); head.className = 'queue-title'; head.textContent = `#${item.id} · ${item.group_key}`;
      const badges = document.createElement('div'); badges.className = 'meta';
      const priority = text('span', item.priority, `pill ${String(item.priority).toLowerCase()}`); badges.append(priority, text('span', item.status));
      button.append(head, badges, text('div', (item.reason_codes || []).join(', '), 'meta'));
      button.addEventListener('click', () => openDetail(item.id)); queue.append(button);
    }
  }
  function renderDetail(d) {
    currentDetail = d; detail.replaceChildren();
    const title = text('h2', `검토 #${d.item.id}`); detail.append(title);
    const badges = document.createElement('div'); badges.className = 'reason';
    badges.append(text('span', d.item.status, 'pill'), text('span', d.item.priority, `pill ${String(d.item.priority).toLowerCase()}`));
    (d.item.reason_codes || []).forEach(code => badges.append(text('code', code))); detail.append(badges);
    if (d.stale) detail.append(text('div', '상품 정보 또는 matcher가 바뀌었습니다. 이 항목은 stale이며 다시 ingest해야 합니다.', 'warning'));
    if (d.conflicts.length) {
      const warning = text('div', '명시적 hard conflict가 있어 APPROVE는 서버에서도 차단됩니다.', 'warning');
      d.conflicts.forEach(c => warning.append(text('div', `${c.code}: ${c.a} ↔ ${c.b}`))); detail.append(warning);
    }
    const members = document.createElement('div'); members.className = 'members';
    d.members.forEach(m => {
      const card = document.createElement('article'); card.className = 'member';
      card.append(text('h3', `${m.mall} · ${m.source_mall}`), text('div', m.title, 'title'), text('div', `${m.price.toLocaleString()}원`, 'price'));
      card.append(text('div', `상품 ID: ${m.product_id} · 판매자 ID: ${m.vendor_item_id || '—'}`, 'meta'));
      card.append(text('div', `모델 번호: ${m.model_number || 'UNKNOWN'} · GTIN: ${m.gtin_present ? '있음' : '없음'}`, 'attrs'));
      const identity = m.identity || {};
      card.append(text('div', `model ${identity.model || '—'} · variant ${(identity.variants || []).join(', ') || '—'} · storage ${(identity.storage || []).join(', ') || '—'} · memory ${(identity.memory || []).join(', ') || '—'}`, 'attrs'));
      card.append(text('div', `color ${(identity.colors || []).join(', ') || '—'} · quantity ${identity.quantity ?? '—'} · condition ${identity.condition || 'unknown'} · transaction ${identity.transactionType || '—'}`, 'attrs'));
      card.append(text('div', `accessory ${identity.accessory ? 'YES' : 'NO'} · bundle ${identity.bundle || '—'} · region ${identity.region || '—'}`, 'attrs'));
      if (m.evidence.length) card.append(text('div', `MATCH evidence: ${m.evidence.join(', ')}`, 'meta'));
      members.append(card);
    }); detail.append(members);
    const table = document.createElement('table'); table.className = 'compare';
    const thead = document.createElement('thead'), hr = document.createElement('tr');
    ['속성', '판정', ...d.members.map(m => m.mall)].forEach(x => hr.append(text('th', x))); thead.append(hr); table.append(thead);
    const tbody = document.createElement('tbody');
    d.comparison.forEach(item => {
      const tr = document.createElement('tr'); tr.append(text('th', item.label), text('td', item.state, `state-${item.state.toLowerCase()}`));
      item.values.forEach(value => tr.append(text('td', value == null ? 'UNKNOWN' : Array.isArray(value) ? value.join(', ') : value)));
      tbody.append(tr);
    }); table.append(tbody); detail.append(table);
    const reasonBox = document.createElement('div'); reasonBox.className = 'attrs';
    reasonBox.textContent = `UNKNOWN fields: ${d.unknown_fields.join(', ') || '없음'}`; detail.append(reasonBox);
    if (d.item.status !== 'IN_REVIEW') {
      const claim = text('button', '이 항목 검토 시작', 'reload'); claim.type = 'button';
      claim.addEventListener('click', async () => { try { await request('/api/identity-review?action=claim', { method: 'POST', body: JSON.stringify({ id: d.item.id }) }); await openDetail(d.item.id); await refresh(); } catch (e) { showError(e); } });
      detail.append(claim); return;
    }
    const form = document.createElement('div'); form.className = 'controls';
    const actionLabel = document.createElement('label'); actionLabel.textContent = '판정 사유';
    const select = document.createElement('select');
    const reasonOptions = [
      ['APPROVE_MISSING_ATTRIBUTE_VERIFIED','누락 속성 외부 확인'],['APPROVE_IDENTICAL_MODEL_BY_EXTERNAL_LABEL','외부 표기로 동일 모델 확인'],['APPROVE_EXACT_CONFIGURATION','구성 정확히 일치'],
      ['REJECT_DIFFERENT_MODEL','다른 모델'],['REJECT_DIFFERENT_VARIANT','다른 variant'],['REJECT_DIFFERENT_STORAGE','다른 저장 용량'],['REJECT_BUNDLE_DIFFERENCE','bundle 차이'],['REJECT_NOT_SAME_PRODUCT','동일 상품 아님'],
      ['DEFER_INSUFFICIENT_EVIDENCE','근거 부족'],['DEFER_NEED_MODEL_NUMBER','모델 번호 확인 필요'],['DEFER_NEED_OPTION_INFO','옵션 정보 필요']
    ];
    reasonOptions.forEach(([value,label]) => { const o=document.createElement('option'); o.value=value; o.textContent=label; select.append(o); });
    actionLabel.append(select); form.append(actionLabel);
    const noteWrap = document.createElement('label'); noteWrap.textContent = '메모 (선택, 최대 1000자)'; const note=document.createElement('textarea'); noteWrap.append(note); form.append(noteWrap); detail.append(form);
    const actions = document.createElement('div'); actions.className='buttons';
    for (const [action,label,cls] of [['approve','APPROVE','approve'],['reject','REJECT','reject'],['defer','DEFER','defer']]) {
      const btn=text('button',label,cls); btn.type='button';
      if (action==='approve' && !d.approve_allowed) btn.disabled=true;
      btn.addEventListener('click', async () => {
        if (action==='approve' && !currentDetail.approve_allowed) return;
        const prefix = `${action.toUpperCase()}_`;
        if (!select.value.startsWith(prefix)) {
          const matching = [...select.options].find(option => option.value.startsWith(prefix));
          if (matching) select.value = matching.value;
        }
        btn.disabled=true;
        try { await request(`/api/identity-review?action=${action}`, {method:'POST',body:JSON.stringify({id:d.item.id,reason_code:select.value,note:note.value})}); status.className='notice'; status.textContent=`${label} 처리했습니다.`; await refresh(); detail.replaceChildren(text('div','처리가 완료되었습니다.','empty')); }
        catch (e) { btn.disabled=false; showError(e); }
      }); actions.append(btn);
    }
    detail.append(actions);
    if (d.item.claimed_by) detail.append(text('div', `검토자: ${d.item.claimed_by}`, 'meta'));
  }
  function showError(error) { status.className='warning'; status.textContent=error.message; }
  async function openDetail(id) {
    selected=id;
    try { const d=await request(`/api/identity-review?action=detail&id=${encodeURIComponent(id)}`); renderDetail(d); [...queue.querySelectorAll('button')].forEach(b=>b.classList.toggle('selected',b.querySelector('.queue-title')?.textContent.startsWith(`#${id} ·`))); }
    catch (e) { showError(e); }
  }
  async function refresh() {
    try { const data=await request('/api/identity-review?action=list'); renderQueue(data.items || []); if(selected && (data.items||[]).some(x=>String(x.id)===String(selected))) await openDetail(selected); }
    catch(e) { showError(e); }
  }
  async function start() {
    token=savedToken();
    if (!token) { status.textContent='SEOSA 이메일 인증 후 관리자 권한을 확인할 수 있습니다.'; return; }
    try { const auth=await request('/api/identity-review?action=auth'); status.className=''; status.textContent=''; app.classList.remove('hidden'); $('signed').textContent=auth.email; await refresh(); }
    catch(e) { status.className='warning'; status.textContent=e.message; }
  }
  $('reload').addEventListener('click', refresh); start();
})();
</script>
</body>
</html>
